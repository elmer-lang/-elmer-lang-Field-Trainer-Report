      .animate-fade { animation: fadeIn 0.4s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .loader { width: 24px; height: 24px; border: 3px solid #FFF; border-bottom-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
      .loader-primary { border-color: #ea580c; border-bottom-color: transparent; } /* Orange-600 */
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      /* RTL Support */
      [dir="rtl"] .text-right { text-align: left; }
      [dir="rtl"] .text-left { text-align: right; }
      
      @media print {
        @page { size: landscape; margin: 0.5cm; }
        .no-print, button, header, .print\:hidden { display: none !important; }
        .print-only { display: block !important; }
        
        /* Overrides to ensure full content prints */
        body, #root, main, .overflow-y-auto, .overflow-hidden { 
          height: auto !important; 
          overflow: visible !important; 
          display: block !important;
        }
        
        body { background: white; -webkit-print-color-adjust: exact; }
        
        /* Ensure charts print correctly */
        .recharts-wrapper { width: 100% !important; height: auto !important; }
        
        /* Table adjustments for print */
        table { width: 100% !important; font-size: 10px; }
        td, th { padding: 4px !important; }

        /* Force Flex for print header */
        .print\:flex { display: flex !important; }
      }
    </style>

        return (

            <span className="font-medium">{message}</span>

      const Button = ({ children, onClick, variant = "primary", isLoading, className = "", disabled }) => {
        const base = "w-full py-2.5 px-4 rounded-lg font-medium transition-all flex justify-center items-center gap-2 shadow-sm active:scale-[0.98]";
        const styles = {
          primary: "bg-orange-600 text-white hover:bg-orange-700 disabled:bg-orange-300",
          secondary: "bg-white text-zinc-700 border border-zinc-300 hover:bg-zinc-50 disabled:bg-zinc-100",

          danger: "bg-red-600 text-white hover:bg-red-700 disabled:bg-red-300"

        return (
          <button onClick={onClick} disabled={isLoading || disabled} className={`${base} ${styles[variant]} ${className} disabled:opacity-70 disabled:cursor-not-allowed`}>

      const Select = ({ label, options, ...props }) => (
        <div className="mb-4">
          <label className="block text-sm font-medium text-slate-700 mb-1">{label}</label>
          <select className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-orange-500 bg-white" {...props}>
            {options.map((o, i) => <option key={i} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );

      const MultiSelect = ({ label, options, selected, onChange }) => {
        const { t } = useTranslation();
        const [isOpen, setIsOpen] = useState(false);
        const [query, setQuery] = useState('');
        const containerRef = useRef(null);
        
        const filteredOptions = options.filter(o => 
           String(o).toLowerCase().includes(query.toLowerCase())
        );

        const toggle = (val) => {
          if (selected.includes(val)) onChange(selected.filter(x => x !== val));
          else onChange([...selected, val]);
        };
        
        // Close on click outside
        useEffect(() => {
           const handleClickOutside = (event) => {
             if (containerRef.current && !containerRef.current.contains(event.target)) {
               setIsOpen(false);
             }
           };
           document.addEventListener("mousedown", handleClickOutside);
           return () => document.removeEventListener("mousedown", handleClickOutside);
        }, [containerRef]);

        return (
          <div className="relative mb-4" ref={containerRef}>
            <label className="block text-xs font-semibold text-gray-600 mb-1">{label}</label>
            <button 
              onClick={() => setIsOpen(!isOpen)} 
              className="w-full text-left text-sm p-2 border rounded focus:ring-2 focus:ring-orange-500 bg-white flex justify-between items-center"
            >
              <span className="truncate">{selected.length ? `${selected.length} selected` : t('all')}</span>
              <Icon name="chevron-down" size={16} />
            </button>
            {isOpen && (
              <div className="absolute z-50 w-full mt-1 bg-white border rounded shadow-xl overflow-hidden animate-fade">
                <div className="p-2 border-b bg-gray-50">
                   <input 
                      type="text" 
                      placeholder={t('idPlaceholder')}
                      className="w-full text-xs p-1.5 border rounded focus:outline-none focus:border-orange-500"
                      value={query}
                      onChange={e => setQuery(e.target.value)}
                      autoFocus
                   />
                </div>
                <div className="max-h-60 overflow-y-auto">
                   {filteredOptions.length > 0 ? filteredOptions.map(opt => (
                     <div key={opt} onClick={() => toggle(opt)} className="px-3 py-2 hover:bg-orange-50 cursor-pointer flex items-center gap-2 text-sm border-b border-gray-50 last:border-0">
                       <input type="checkbox" checked={selected.includes(opt)} readOnly className="rounded text-orange-600 focus:ring-orange-500 pointer-events-none" />
                       <span className="truncate">{opt}</span>
                     </div>
                   )) : <div className="p-3 text-xs text-gray-400 text-center">No options found</div>}
                </div>
              </div>
            )}
          </div>
        );
      };
      
      const Modal = ({ title, children, onClose }) => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade">
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden max-h-[90vh] flex flex-col">

                    <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><Icon name="x" size={20}/></button>
                </div>
                <div className="p-5 overflow-y-auto">{children}</div>
            </div>
        </div>
      );

      const ImageUploadModal = ({ isOpen, onClose, onSave }) => {
        const { t } = useTranslation();
        const [mode, setMode] = useState('UPLOAD'); // UPLOAD | CAMERA
        const [preview, setPreview] = useState(null);
        const [loading, setLoading] = useState(false);
        const [stream, setStream] = useState(null);
        const videoRef = useRef(null);
        const canvasRef = useRef(null);

        useEffect(() => {
           if (!isOpen) {
             stopCamera();
             setPreview(null);
             setMode('UPLOAD');
           }
        }, [isOpen]);

        const stopCamera = () => {
           if (stream) {
              stream.getTracks().forEach(track => track.stop());
              setStream(null);
           }
        };

        const startCamera = async () => {
           setMode('CAMERA');
           setPreview(null);
           try {
              const s = await navigator.mediaDevices.getUserMedia({ video: true });
              setStream(s);
              if (videoRef.current) videoRef.current.srcObject = s;
           } catch(e) {
              alert(t('noCamera') + ": " + e.message);
              setMode('UPLOAD');
           }
        };

        const handleFileChange = (e) => {
           const file = e.target.files[0];
           if (file) {
              const reader = new FileReader();
              reader.onloadend = () => {
                 setPreview(reader.result);
              };
              reader.readAsDataURL(file);
           }
        };

        const capture = () => {
           if (videoRef.current && canvasRef.current) {
               const video = videoRef.current;
               const canvas = canvasRef.current;
               canvas.width = video.videoWidth;
               canvas.height = video.videoHeight;
               const ctx = canvas.getContext('2d');
               ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
               const data = canvas.toDataURL('image/jpeg', 0.8);
               setPreview(data);
               stopCamera();
           }
        };

        const saveImage = async () => {
           if (!preview) return;
           setLoading(true);
           try {
              // Resize before sending to save bandwidth and storage
              const img = new Image();
              img.src = preview;
              img.onload = async () => {
                 const canvas = document.createElement('canvas');
                 const maxSize = 600; 
                 let width = img.width;
                 let height = img.height;
                 
                 if (width > height) {
                    if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                 } else {
                    if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                 }
                 
                 canvas.width = width;
                 canvas.height = height;
                 const ctx = canvas.getContext('2d');
                 ctx.drawImage(img, 0, 0, width, height);
                 const resizedData = canvas.toDataURL('image/jpeg', 0.8);
                 
                 await onSave(resizedData);
                 onClose();
              };
           } catch(e) {
              alert(e.message);
           } finally {
              setLoading(false);
           }
        };

        if (!isOpen) return null;

        return (
           <Modal title={t('changePhoto')} onClose={onClose}>
              <div className="flex gap-2 mb-4">
                 <button onClick={() => { stopCamera(); setMode('UPLOAD'); }} className={`flex-1 py-2 text-sm font-bold rounded-lg ${mode === 'UPLOAD' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                    <div className="flex items-center justify-center gap-2"><Icon name="upload" size={16} /> {t('upload')}</div>
                 </button>
                 <button onClick={startCamera} className={`flex-1 py-2 text-sm font-bold rounded-lg ${mode === 'CAMERA' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                    <div className="flex items-center justify-center gap-2"><Icon name="camera" size={16} /> {t('camera')}</div>
                 </button>
              </div>

              <div className="bg-zinc-100 rounded-lg aspect-square flex items-center justify-center overflow-hidden mb-4 relative border border-zinc-200">
                 {mode === 'UPLOAD' && !preview && (
                    <label className="cursor-pointer flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-orange-500 transition-colors">
                       <Icon name="image-plus" size={48} />
                       <span className="text-xs mt-2 font-medium">Click to select image</span>
                       <input type="file" className="hidden" accept="image/*" onChange={handleFileChange} />
                    </label>
                 )}
                 
                 {mode === 'CAMERA' && !preview && (
                    <div className="relative w-full h-full bg-black">
                       <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover transform scale-x-[-1]" />
                       <canvas ref={canvasRef} className="hidden" />
                       <button onClick={capture} className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white rounded-full p-4 shadow-lg hover:scale-105 transition-transform">
                          <div className="w-4 h-4 bg-red-500 rounded-full"></div>
                       </button>
                    </div>
                 )}

                 {preview && (
                    <div className="relative w-full h-full">
                       <img src={preview} alt="Preview" className="w-full h-full object-cover" />
                       <button onClick={() => { setPreview(null); if(mode==='CAMERA') startCamera(); }} className="absolute top-2 right-2 bg-black/50 text-white p-2 rounded-full hover:bg-black/70">
                          <Icon name="rotate-ccw" size={16} />

                    </div>

              </div>

              <div className="flex gap-2">
                 <Button variant="secondary" onClick={onClose} disabled={loading}>{t('cancel')}</Button>
                 <Button onClick={saveImage} isLoading={loading} disabled={!preview}>{t('save')}</Button>

      const EvaluationForm = ({ user, onLogout }) => {
        const { t } = useTranslation();
        const [loading, setLoading] = useState(true);
        const [db, setDb] = useState([]);
        const [qs, setQs] = useState([]);
        const [form, setForm] = useState({ traineeName:'', traineeId:'', email: '', evaluationType:'1st Half', position:'Team Member', trainerName:'', branch:'', teamLeader:'', area:'', overallGrade:'A', scores:{} });
        const [statusData, setStatusData] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [calculation, setCalculation] = useState({ totalScore: 0, letterGrade: 'D', categoryScores: {} });
        const [alertMsg, setAlertMsg] = useState(null); 
        
        // Lookup Options
        const [traineeOptions, setTraineeOptions] = useState([]);
        const [branchOptions, setBranchOptions] = useState([]);
        
        const [pdfResult, setPdfResult] = useState(null);
        const [sendingEmail, setSendingEmail] = useState(false);
        const [emailStatus, setEmailStatus] = useState(null);

        const gradeMeta = {
          "A+": { text: "Excellent, Consider for Mentorship", stars: "⭐⭐⭐⭐⭐" },
          "A":  { text: "Good, Maintain and Motivate", stars: "⭐⭐⭐⭐" },
          "B":  { text: "Continue routine supervision", stars: "⭐⭐⭐" },
          "C":  { text: "Immediate coaching", stars: "⭐⭐" },
          "D":  { text: "Mandatory retraining & plan", stars: "⭐" },
          "-":  { text: "Pending", stars: "" }
        };

        useEffect(() => {
          Promise.all([server.getFTDatabase(), server.getQuestions()]).then(([d, q]) => {
            setDb(d); setQs(q); setLoading(false);
          });
          
          if (user) {
             setForm(f => ({...f, trainerName: user.name}));
             if(user.branch) setForm(f => ({...f, branch: user.branch}));
          }
        }, []);
        
        useEffect(() => {
           if (!db.length) return;
           const map = new Map();
           db.forEach(r => {
              if (r.traineeId) map.set(String(r.traineeId), r.traineeName);
           });
           setTraineeOptions(Array.from(map.entries()).map(([id, name]) => ({ id, name })));
        }, [db]);

        useEffect(() => {
            if (!form.trainerName || !db.length) return;
            const trainerRows = db.filter(r => r.trainerName === form.trainerName);
            const branches = [...new Set(trainerRows.map(r => r.branch).filter(Boolean))];
            setBranchOptions(branches);

            if (branches.length === 1 && form.branch !== branches[0]) {
               const row = trainerRows.find(r => r.branch === branches[0]);
               setForm(f => ({...f, branch: branches[0], teamLeader: row?.teamLeader||'', area: row?.area||''}));
            }
        }, [form.trainerName, db]);

        const handleIdChange = (e) => {
           const val = e.target.value;
           const match = traineeOptions.find(o => o.id === val);
           setForm(f => ({
               ...f, 
               traineeId: val,
               traineeName: match ? match.name : f.traineeName 
           }));
           if (match) checkId(val);
        };

        const handleBranchChange = (e) => {
           const b = e.target.value;
           const row = db.find(r => r.trainerName === form.trainerName && r.branch === b);
           setForm(f => ({...f, branch: b, teamLeader: row?.teamLeader||'', area: row?.area||''}));
        };

        useEffect(() => {
          if (!qs.length) return;
          
          const gradeValues = { "A+": 100, "A": 90, "B": 80, "C": 70, "D": 60 };
          const categories = {};
          
          qs.forEach(q => {
            if (q.type === 'radio' || q.type === 'dropdown') {
              const answer = form.scores[q.id];
              const score = gradeValues[answer] || 0;
              if (answer) {
                if (!categories[q.category]) categories[q.category] = { sum: 0, count: 0 };
                categories[q.category].sum += score;
                categories[q.category].count++;
              }
            }
          });

          let totalSum = 0;
          let totalCount = 0;
          const catScores = {};

          Object.keys(categories).forEach(cat => {
            const avg = categories[cat].sum / categories[cat].count;
            catScores[cat] = Math.round(avg);
            totalSum += avg; 
            totalCount++; 
          });

          const grandAvg = totalCount > 0 ? totalSum / totalCount : 0;
          let letter = 'D';
          if (grandAvg >= 98) letter = 'A+';
          else if (grandAvg >= 90) letter = 'A';
          else if (grandAvg >= 80) letter = 'B';
          else if (grandAvg >= 70) letter = 'C';
          else letter = 'D';

          setCalculation({ totalScore: Math.round(grandAvg), letterGrade: letter, categoryScores: catScores });
          setForm(f => ({ ...f, overallGrade: letter }));
        }, [form.scores, qs]);

        const checkId = async (specificId) => {
          const targetId = specificId || form.traineeId;
          if(!targetId) return;
          
          setAlertMsg(null);
          setStatusData(null);
          
          try {
            const res = await server.checkPrev(targetId);
            if(res && res.found) { 
              setStatusData(res);
              setForm(f => ({
                ...f, 
                traineeName: res.traineeName || f.traineeName,
                position: res.position || f.position,
                email: res.email || f.email
              })); 

              if (res.completed) {
                  setAlertMsg({ type: 'error', msg: "Evaluation Complete" });
              } else if (res.first) {
                 setAlertMsg({ type: 'success', msg: "1st Half Found" });
                 setForm(f => ({ ...f, evaluationType: '2nd Half' }));
              }
            }
          } catch(e) { console.error(e); }
        };

        const submit = async (e) => {
          e.preventDefault();
          if (statusData && statusData.completed) {
             alert("Cannot submit: Both evaluations are already completed for this month.");
             return;
          }
          setSubmitting(true);
          setAlertMsg(null);
          try { 
             const result = await server.submit(form); 
             setPdfResult(result);
          }
          catch(e) { setAlertMsg({ type: 'error', msg: "Error: "+e.message }); }
          setSubmitting(false);
        };

        const sendEmailToEmployee = async () => {
            if (!form.email) {
                setEmailStatus({ type: 'error', msg: "No email address found for trainee." });
                return;
            }
            setSendingEmail(true);
            setEmailStatus(null);
            try {
                await server.sendEmail(form.email, user.email, form.traineeName, form.evaluationType, pdfResult.base64);
                setEmailStatus({ type: 'success', msg: "Email sent to All Recipients!" });
            } catch (e) {
                setEmailStatus({ type: 'error', msg: "Failed to send email: " + e.message });
            } finally {
                setSendingEmail(false);
            }
        };

        const resetForm = () => {
            setPdfResult(null);
            setSendingEmail(false);
            setEmailStatus(null);
            setForm(f => ({ 
               ...f, 
               traineeId: '', 
               traineeName: '', 
               email: '',
               scores: {}, 
               evaluationType: '1st Half',
               overallGrade: 'A' 
            }));
            setStatusData(null);
            setAlertMsg(null);
        };
        
        const downloadPdf = () => {
           if(!pdfResult || !pdfResult.base64) return;
           const link = document.createElement('a');
           link.href = `data:application/pdf;base64,${pdfResult.base64}`;
           link.download = `${form.traineeId}-${form.traineeName}.pdf`;
           document.body.appendChild(link);
           link.click();
           document.body.removeChild(link);
        };

        const openPreview = () => {
           if(!pdfResult || !pdfResult.base64) {
             alert("PDF data not available.");
             return;
           }
           try {
             const byteCharacters = atob(pdfResult.base64);
             const byteNumbers = new Array(byteCharacters.length);
             for (let i = 0; i < byteCharacters.length; i++) {
                 byteNumbers[i] = byteCharacters.charCodeAt(i);
             }
             const byteArray = new Uint8Array(byteNumbers);
             const file = new Blob([byteArray], { type: 'application/pdf' });
             const fileURL = URL.createObjectURL(file);
             window.open(fileURL, '_blank');
           } catch(e) {
             alert("Could not open preview: " + e.message);
           }
        };

        const getSummaryStyle = (grade) => {
            const base = "border-none text-slate-900 transition-colors duration-300"; 
            if (grade.startsWith('A')) return `${base} bg-emerald-400`; 
            if (grade === 'B') return `${base} bg-yellow-400`; 
            if (grade === 'C') return `${base} bg-orange-400`; 
            return `${base} bg-red-400`; 
        };

        if(loading) return <div className="flex justify-center p-10"><div className="loader loader-primary"></div></div>;

        if (pdfResult) {
            return (
              <Layout title={t('evalComplete')} user={user} onLogout={onLogout}>
                  <div className="max-w-md mx-auto mt-10 text-center animate-fade">
                      <Card className="border-t-4 border-emerald-500">
                          <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                              <Icon name="check" size={32} className="text-emerald-600" />
                          </div>
                          <h2 className="text-2xl font-bold text-slate-800 mb-2">{t('evalComplete')}</h2>
                          <p className="text-slate-500 mb-6">{t('evalSaved')}</p>
                          
                          {emailStatus && (
                             <Alert type={emailStatus.type} message={emailStatus.msg} />
                          )}

                          <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={openPreview} className="w-full py-3 px-4 bg-orange-600 text-white rounded-lg font-medium hover:bg-orange-700 flex items-center justify-center gap-2 transition-colors shadow-sm">
                                   <Icon name="eye" size={20}/> {t('preview')}
                                </button>
                                <button onClick={downloadPdf} className="w-full py-3 px-4 bg-slate-800 text-white rounded-lg font-medium hover:bg-slate-900 flex items-center justify-center gap-2 transition-colors shadow-sm">
                                   <Icon name="download" size={20}/> {t('download')}
                                </button>
                            </div>
                            
                            <button 
                                onClick={sendEmailToEmployee} 
                                disabled={sendingEmail || (emailStatus && emailStatus.type === 'success')}
                                className="w-full py-3 px-4 bg-emerald-600 text-white rounded-lg font-medium hover:bg-emerald-700 flex items-center justify-center gap-2 transition-colors shadow-sm disabled:opacity-60 disabled:cursor-not-allowed"
                            >
                               {sendingEmail ? <div className="loader w-5 h-5"></div> : <Icon name="mail" size={20}/>} 
                               Send Email to All
                            </button>

                            <div className="text-sm bg-zinc-50 p-4 rounded-lg border border-zinc-200">
                              <p className="text-slate-600 mb-1">Google Drive Status:</p>
                              {pdfResult.url && !pdfResult.url.startsWith("Error") ? (
                                <a href={pdfResult.url} target="_blank" className="text-orange-600 hover:text-orange-800 font-medium inline-flex items-center gap-1 break-all">
                                  {t('openDrive')} <Icon name="external-link" size={14} />
                                </a>
                              ) : (
                                <span className="text-red-500 text-xs">{pdfResult.url}</span>
                              )}
                            </div>

                            <Button onClick={resetForm} variant="secondary">{t('evalAnother')}</Button>
                          </div>
                      </Card>
                  </div>
              </Layout>
            );
        }

        const filteredQs = qs.filter(q => q.targetPosition === 'Both' || q.targetPosition === form.position);
        
        return (
          <Layout title={t('evalForm')} user={user} onLogout={onLogout}>
            <form onSubmit={submit} className="max-w-3xl mx-auto space-y-6">
              
              <div className="bg-white p-4 rounded-xl border border-zinc-200 text-sm grid grid-cols-2 md:grid-cols-5 gap-2 text-center shadow-sm">
                <div className="bg-green-50 text-green-800 p-1 rounded"><strong>A+</strong> {t('excellent')}</div>
                <div className="bg-blue-50 text-blue-800 p-1 rounded"><strong>A</strong> {t('exceeds')}</div>
                <div className="bg-yellow-50 text-yellow-800 p-1 rounded"><strong>B</strong> {t('meets')}</div>
                <div className="bg-orange-50 text-orange-800 p-1 rounded"><strong>C</strong> {t('inconsistent')}</div>
                <div className="bg-red-50 text-red-800 p-1 rounded"><strong>D</strong> {t('unsatisfactory')}</div>
              </div>
              
              {statusData && (
                 <div className="grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade">
                    <div className={`p-4 rounded-xl border-l-4 shadow-sm ${statusData.first ? 'bg-white border-green-500' : 'bg-zinc-50 border-zinc-300'}`}>
                       <div className="flex justify-between items-start">
                          <div>
                            <p className="text-xs font-bold uppercase text-slate-500 mb-1">{t('firstHalf')}</p>
                            {statusData.first ? (
                               <div>
                                  <p className="text-sm font-bold text-slate-800 leading-tight mb-1">
                                     {statusData.first.grade} = {gradeMeta[statusData.first.grade]?.text}
                                  </p>
                                  <p className="text-xs text-slate-600 flex items-center gap-1 mb-1">
                                     {gradeMeta[statusData.first.grade]?.stars}
                                  </p>
                                  <p className="text-xs text-slate-500">
                                     Date: {new Date(statusData.first.date).toLocaleDateString('en-GB')}
                                  </p>
                               </div>
                            ) : (
                               <p className="text-2xl font-bold text-slate-400">{t('pending')}</p>
                            )}
                          </div>
                          {statusData.first && <Icon name="check-circle" className="text-green-500" />}
                       </div>
                    </div>
                    <div className={`p-4 rounded-xl border-l-4 shadow-sm ${statusData.second ? 'bg-white border-green-500' : 'bg-zinc-50 border-zinc-300'}`}>
                       <div className="flex justify-between items-start">
                          <div>
                            <p className="text-xs font-bold uppercase text-slate-500 mb-1">{t('secondHalf')}</p>
                            {statusData.second ? (
                               <div>
                                  <p className="text-sm font-bold text-slate-800 leading-tight mb-1">
                                     {statusData.second.grade} = {gradeMeta[statusData.second.grade]?.text}
                                  </p>
                                  <p className="text-xs text-slate-600 flex items-center gap-1 mb-1">
                                     {gradeMeta[statusData.second.grade]?.stars}
                                  </p>
                                  <p className="text-xs text-slate-500">
                                     Date: {new Date(statusData.second.date).toLocaleDateString('en-GB')}
                                  </p>
                               </div>
                            ) : (
                               <p className="text-2xl font-bold text-slate-400">{t('pending')}</p>
                            )}
                          </div>
                          {statusData.second && <Icon name="check-circle" className="text-green-500" />}
                       </div>
                    </div>
                 </div>
              )}

              {alertMsg && <Alert type={alertMsg.type} message={alertMsg.msg} />}

              <Card title={t('traineeInfo')}>
                <div className="grid md:grid-cols-2 gap-4">
                   <div className="relative">
                     <label className="block text-sm font-medium text-slate-700 mb-1">{t('traineeID')}</label>
                     <input 
                        list="traineeList" 
                        value={form.traineeId} 
                        onChange={handleIdChange} 
                        onBlur={() => checkId()} 
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none"
                        required 
                     />
                     <datalist id="traineeList">
                        {traineeOptions.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                     </datalist>
                   </div>
                   
                   <Input label={t('traineeName')} value={form.traineeName} onChange={e => setForm({...form, traineeName:e.target.value})} readOnly={statusData || traineeOptions.some(o => o.id === form.traineeId)} className={statusData ? 'bg-zinc-100' : ''} required />
                   
                   <div className="mb-4">
                       <label className="block text-sm font-medium text-slate-700 mb-1">
                          {t('email')} <span className="text-red-500">*</span>
                       </label>
                       <div className="relative">
                         <input
                            type="email"
                            value={form.email}
                            onChange={e => setForm({...form, email: e.target.value})}
                            list="emailOptions"
                            className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none"
                            required
                            placeholder="Select or type email..."
                         />
                         <div className="absolute right-3 top-2.5 pointer-events-none text-gray-400">
                            <Icon name="chevron-down" size={16} />
                         </div>
                       </div>
                       <datalist id="emailOptions">
                          {form.traineeId && <option value={`${form.traineeId}@newboncafe.com`}/>}
                          <option value="@gmail.com" />
                          <option value="@outlook.com" />
                          <option value="@yahoo.com" />
                       </datalist>
                   </div>

                   <Select label={t('evalType')} value={form.evaluationType} onChange={e => setForm({...form, evaluationType:e.target.value})} options={[{label:t('firstHalf'), value:'1st Half'}, {label:t('secondHalf'), value:'2nd Half'}]} required />
                   
                   <Select label={t('position')} value={form.position} onChange={e => setForm({...form, position:e.target.value})} options={[{label:t('teamMember'), value:'Team Member'}, {label:t('teamLeader'), value:'Team Leader'}]} required />
                   
                   <Input label={t('trainerName')} value={form.trainerName} readOnly className="bg-zinc-100 font-semibold text-slate-700" />
                   
                   <Select 
                      label={t('branch')} 
                      value={form.branch} 
                      onChange={handleBranchChange} 
                      options={branchOptions.map(b => ({ label: b, value: b }))} 
                      required 
                   />
                </div>
              </Card>

              {Object.entries(filteredQs.reduce((a,q) => (a[q.category] = [...(a[q.category]||[]), q], a), {})).map(([cat, qList]) => (
                <Card 
                    key={cat} 
                    title={`${cat} (Avg: ${calculation.categoryScores[cat] || 0}%)`}
                    className="border-2 border-orange-500 shadow-md"
                    titleClass="bg-orange-50 text-orange-900"
                >
                  {qList.map(q => (
                    <div key={q.id} className="mb-4 pb-4 border-b border-zinc-100 last:border-0 last:mb-0 last:pb-0">
                      <p className="font-medium mb-2">{q.text}</p>
                      {q.type === 'radio' ? (
                        <div className="flex gap-4 flex-wrap">
                          {q.options.map(o => (
                            <label key={o} className="flex items-center gap-1 cursor-pointer hover:bg-zinc-50 p-1 rounded">
                              <input type="radio" name={q.id} checked={form.scores[q.id] === o} onChange={() => setForm(f => ({...f, scores: {...f.scores, [q.id]: o}}))} className="text-orange-600" required />
                              <span className="font-bold text-sm">{o}</span>
                            </label>
                          ))}
                        </div>
                      ) : q.type === 'dropdown' ? (
                        <select 
                          className="w-full border border-zinc-300 rounded p-2 text-sm focus:ring-2 focus:ring-orange-500 bg-white"
                          value={form.scores[q.id] || ''}
                          onChange={e => setForm(f => ({...f, scores: {...f.scores, [q.id]: e.target.value}}))}
                          required
                        >
                          <option value="">{t('select')}</option>
                          {q.options.map(o => (
                            <option key={o} value={o}>{o}</option>
                          ))}
                        </select>
                      ) : (
                        <textarea className="w-full border rounded p-2 text-sm" rows="2" onChange={e => setForm(f => ({...f, scores: {...f.scores, [q.id]: e.target.value}}))} required></textarea>
                      )}
                    </div>
                  ))}
                </Card>
              ))}

              <Card title="Evaluation Summary" className={getSummaryStyle(calculation.letterGrade)} titleClass="text-slate-900/70 border-slate-900/10">
                 <div className="flex justify-between items-center">
                   <div>
                     <p className="text-slate-900/60 text-sm uppercase font-bold">{t('totalScore')}</p>
                     <p className="text-4xl font-bold text-slate-900">{calculation.totalScore}%</p>
                   </div>
                   <div className="text-right">
                     <p className="text-slate-900/60 text-sm uppercase font-bold">{t('overallRating')}</p>
                     <div className={`text-4xl font-bold px-4 py-1 rounded inline-block mt-1 bg-black/10 text-slate-900`}>
                       {calculation.letterGrade}
                     </div>
                   </div>
                 </div>
                 <Button type="submit" isLoading={submitting} disabled={statusData && statusData.completed} className="mt-6 py-4 text-lg bg-slate-900 hover:bg-slate-800 text-white border-none">{t('submit')}</Button>
              </Card>
            </form>
          </Layout>
        );
      };

      const Dashboard = ({ user, onLogout, portal, onUpdateUser }) => {
        const { t, lang } = useTranslation();
        const [stats, setStats] = useState(null);
        const [requests, setRequests] = useState([]); // Store pending edit requests
        const [regRequests, setRegRequests] = useState([]); // Store pending REGISTRATION requests (Admin Only)
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [viewingId, setViewingId] = useState(null);
        const [sendingRow, setSendingRow] = useState(null); // Track which row is sending email

        // Edit Modal State
        const [isEditModalOpen, setEditModalOpen] = useState(false);
        const [editTarget, setEditTarget] = useState(null); // { responseId, type }
        const [editReason, setEditReason] = useState("");
        const [isSubmittingRequest, setSubmittingRequest] = useState(false);

        // Image Update State
        const [isImageModalOpen, setImageModalOpen] = useState(false);

        // --- Filters State ---
        const [dateFrom, setDateFrom] = useState('');
        const [dateTo, setDateTo] = useState('');
        const [filterPosition, setFilterPosition] = useState('All');
        
        // Multi-select Filters State
        const [selectedNames, setSelectedNames] = useState([]);
        const [selectedBranches, setSelectedBranches] = useState([]);
        const [selectedGrades, setSelectedGrades] = useState([]);
        // Admin Only Filter
        const [selectedTrainers, setSelectedTrainers] = useState([]);

        const loadData = () => {
           setLoading(true);
           const promises = [
              server.getStats(),
              server.getRequests(portal === 'ADMIN' ? 'ADMIN' : 'TRAINER', user.name)
           ];
           
           if (portal === 'ADMIN') {
               promises.push(server.getRegistrationRequests());
           }

           Promise.all(promises)
           .then((results) => {
              setStats(results[0]);
              setRequests(results[1]);
              if (portal === 'ADMIN') setRegRequests(results[2] || []);
              setLoading(false);
           })
           .catch(err => {
              setError(err.message);
              setLoading(false);
           });
        };

        useEffect(() => { 
          // Set Default Dates to Current Month (Timezone Safe)
          const now = new Date();
          const firstDay = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
          const lastDayObj = new Date(now.getFullYear(), now.getMonth() + 1, 0); // Last day of current month
          const lastDay = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(lastDayObj.getDate()).padStart(2, '0')}`;
          
          setDateFrom(firstDay);
          setDateTo(lastDay);

          loadData();
        }, []);
        
        const getGradeValue = (g) => ({ "A+": 100, "A": 90, "B": 80, "C": 70, "D": 60 }[g] || 0);
        const getGradeLetter = (n) => {
          if (n >= 98) return "A+";
          if (n >= 90) return "A";
          if (n >= 80) return "B";
          if (n >= 70) return "C";
          return "D";
        };

        const handleImageUpdate = async (base64) => {
           try {
              const newUrl = await server.updateUserImage(user.id, base64);
              onUpdateUser({ image: newUrl }); // Update local user state
              alert(t('updatePhotoSuccess'));
              setImageModalOpen(false);
           } catch(e) {
              alert("Error: " + e.message);
           }
        };

        const handleViewReport = async (id) => {
          if (viewingId) return; // Prevent double click
          setViewingId(id);
          try {
             const result = await server.getReport(id);
             if (result && result.base64) {
                 const byteCharacters = atob(result.base64);
                 const byteNumbers = new Array(byteCharacters.length);
                 for (let i = 0; i < byteCharacters.length; i++) {
                     byteNumbers[i] = byteCharacters.charCodeAt(i);
                 }
                 const byteArray = new Uint8Array(byteNumbers);
                 const file = new Blob([byteArray], { type: 'application/pdf' });
                 const fileURL = URL.createObjectURL(file);
                 window.open(fileURL, '_blank');
             } else {
                 alert("Could not generate preview.");
             }
          } catch(e) {
             alert("Error loading report: " + e.message);
          } finally {
             setViewingId(null);
          }
        };

        const handleViewCombined = async (id1, id2) => {
          if (!id1 && !id2) return;
          const key = `combined-${id1}-${id2}`;
          if (viewingId === key) return;
          setViewingId(key);
          
          try {
             const result = await server.getCombinedReport(id1, id2);
             if (result && result.base64) {
                 const byteCharacters = atob(result.base64);
                 const byteNumbers = new Array(byteCharacters.length);
                 for (let i = 0; i < byteCharacters.length; i++) {
                     byteNumbers[i] = byteCharacters.charCodeAt(i);
                 }
                 const byteArray = new Uint8Array(byteNumbers);
                 const file = new Blob([byteArray], { type: 'application/pdf' });
                 const fileURL = URL.createObjectURL(file);
                 window.open(fileURL, '_blank');
             } else {
                 alert("Could not generate combined report.");
             }
          } catch(e) {
             alert("Error loading report: " + e.message);
          } finally {
             setViewingId(null);
          }
        };

        const handleSendCombinedEmail = async (row) => {
            if (!row.email) { alert("No email found for trainee."); return; }
            if (sendingRow) return;
            
            setSendingRow(row.traineeId);
            try {
               const id1 = row.first?.id;
               const id2 = row.second?.id;
               const pdf = await server.getCombinedReport(id1, id2);
               await server.sendEmail(row.email, user.email, row.traineeName, "Overall Performance", pdf.base64);
               alert(`Email successfully sent to ${row.traineeName} (CC: ${user.email})`);
            } catch(e) {
               alert("Failed to send email: " + e.message);
            } finally {
               setSendingRow(null);
            }
        };

        const openRequestModal = (responseId, evalType) => {
           setEditTarget({ responseId, evalType });
           setEditReason("");
           setEditModalOpen(true);
        };

        const submitRequest = async () => {
           if (!editReason.trim()) { alert("Please provide a reason."); return; }
           setSubmittingRequest(true);
           try {
              await server.requestEdit(editTarget.responseId, user.name, editReason);
              alert("Request Submitted. Waiting for Admin Approval.");
              setEditModalOpen(false);
              loadData(); 
           } catch(e) {
              alert(e.message);
           } finally {
              setSubmittingRequest(false);
           }
        };
        
        const processRequest = async (reqId, action) => {
           if (!confirm(`Confirm ${action}?`)) return;
           try {
              await server.processRequest(reqId, action);
              loadData();
           } catch(e) { alert(e.message); }
        };

        const processRegistration = async (reqId, action) => {
           if (!confirm(`Confirm ${action}?`)) return;
           try {
              await server.processRegistration(reqId, action);
              loadData();
           } catch(e) { alert(e.message); }
        };
        
        const handleMonthChange = (e) => {
           const val = e.target.value; // YYYY-MM
           if (val) {
               const [y, m] = val.split('-');
               const start = `${val}-01`;
               const lastDay = new Date(parseInt(y), parseInt(m), 0).getDate();
               const end = `${val}-${String(lastDay).padStart(2, '0')}`;
               
               setDateFrom(start);
               setDateTo(end);
           }
        };

        const handleYearChange = (e) => {
           const val = e.target.value;
           if (val) {
               setDateFrom(`${val}-01-01`);
               setDateTo(`${val}-12-31`);
           }
        };

        const filteredFlatList = useMemo(() => {
           if (!stats || !stats.list) return [];
           return stats.list.filter(item => {
             if (portal === 'DASHBOARD') {
                 if (String(item.trainerName).trim() !== String(user.name).trim()) return false;
             }
             if (portal === 'ADMIN' && selectedTrainers.length > 0) {
                 if (!selectedTrainers.includes(item.trainerName)) return false;
             }

             let itemDate = '';
             if(item.date) itemDate = new Date(item.date).toISOString().split('T')[0];

             if (dateFrom && itemDate < dateFrom) return false;
             if (dateTo && itemDate > dateTo) return false;

             if (filterPosition !== 'All' && item.position !== filterPosition) return false;

             if (selectedNames.length > 0) {
                const combinedName = `${item.traineeName} (${item.traineeId || 'No ID'})`;
                if (!selectedNames.includes(combinedName)) return false;
             }
             
             if (selectedBranches.length > 0 && !selectedBranches.includes(item.branch)) return false;
             if (selectedGrades.length > 0 && !selectedGrades.includes(item.overallGrade)) return false;

             return true;
          });
        }, [stats, dateFrom, dateTo, filterPosition, selectedNames, selectedBranches, selectedGrades, selectedTrainers, portal, user]);

        const derivedStats = useMemo(() => {
           if (!stats) return { total: 0, average: 0, distribution: [], categoryPerformance: [], firstHalf: 0, secondHalf: 0, totalEmployees: 0, totalRequests: 0, memberCount: 0, leaderCount: 0 };
           const count = filteredFlatList.length;
           const gradeCounts = { "A+": 0, "A": 0, "B": 0, "C": 0, "D": 0 };
           const gradeScores = { "A+": 100, "A": 90, "B": 80, "C": 70, "D": 60 };
           
           let totalScore = 0;
           let catSums = {};
           let catCounts = {};

           filteredFlatList.forEach(item => {
              const g = item.overallGrade;
              if(gradeCounts.hasOwnProperty(g)) gradeCounts[g]++;
              else gradeCounts["D"]++;
              
              totalScore += (gradeScores[g] || 0);

              if (item.categoryScores) {
                  Object.keys(item.categoryScores).forEach(cat => {
                      if (!catSums[cat]) { catSums[cat] = 0; catCounts[cat] = 0; }
                      catSums[cat] += item.categoryScores[cat];
                      catCounts[cat]++;
                  });
              }
           });

           const avg = count ? Math.round(totalScore / count) : 0;
           const distribution = Object.keys(gradeCounts).map(k => ({ name: k, value: gradeCounts[k] }));
           
           const categoryPerformance = Object.keys(catSums).map(k => ({
              category: k,
              score: Math.round(catSums[k] / catCounts[k]) || 0
           }));
           if (categoryPerformance.length === 0) categoryPerformance.push({ category: "No Data", score: 0 });
           
           const uniqueMap = {}; 
           filteredFlatList.forEach(i => {
              if (i.traineeId) uniqueMap[i.traineeId] = i.position;
           });
           
           const positions = Object.values(uniqueMap);
           const memberCount = positions.filter(p => p === 'Team Member' || p === 'Team Member').length;
           const leaderCount = positions.filter(p => p === 'Team Leader' || p === 'TL').length;
           const totalEmployees = positions.length;
           
           const responseIdsInView = new Set(filteredFlatList.map(r => r.id));
           const relevantRequests = requests.filter(req => responseIdsInView.has(req.responseId) && req.status === 'Pending').length;

           return {
              total: count,
              average: avg,
              distribution,
              categoryPerformance,
              firstHalf: filteredFlatList.filter(x => x.evaluationType === '1st Half').length,
              secondHalf: filteredFlatList.filter(x => x.evaluationType === '2nd Half').length,
              totalEmployees,
              totalRequests: relevantRequests,
              memberCount,
              leaderCount
           };
        }, [filteredFlatList, stats, requests]);

        const groupedList = useMemo(() => {
            return Object.values(filteredFlatList.reduce((acc, item) => {
                const key = item.traineeId || item.traineeName;
                if (!acc[key]) {
                    acc[key] = {
                        traineeId: item.traineeId,
                        traineeName: item.traineeName,
                        branch: item.branch,
                        position: item.position,
                        trainerName: item.trainerName,
                        email: item.email, 
                        first: null,
                        second: null,
                        comments: []
                    };
                }
                if (item.evaluationType === '1st Half') acc[key].first = item;
                if (item.evaluationType === '2nd Half') acc[key].second = item;
                if (item.comments) acc[key].comments.push(item.comments);
                if (item.email && !acc[key].email) acc[key].email = item.email;
                return acc;
            }, {}));
        }, [filteredFlatList]);
        
        const uniqueOptions = useMemo(() => {
            let sourceList = stats ? stats.list : [];
            if (portal === 'DASHBOARD' && user) {

                grades: Array.from(new Set(sourceList.map(i => i.overallGrade).filter(Boolean))).sort(),

        if(error || !stats) return <Layout title={t('dashboard')} user={user} onLogout={onLogout}><div className="p-10 text-center text-red-500">Failed to load dashboard data. <br/>{error}</div></Layout>;

                                     }`}>{r.first.overallGrade}</div>
                                     <div className="print:hidden">
                                        <div className="flex gap-2 items-center mt-0.5">
                                          {r.first.id && (
                                            <button onClick={() => handleViewReport(r.first.id)} disabled={viewingId === r.first.id} className="text-orange-600 hover:underline text-xs flex items-center gap-1">
                                               {viewingId === r.first.id ? "..." : t('viewPdf')}
                                            </button>
                                          )}
                                          
                                          {portal === 'ADMIN' ? (
                                              reqFirst ? (
                                                <div className="flex gap-1 ml-1">
                                                  <button onClick={() => processRequest(reqFirst.requestId, 'Approved')} className="p-0.5 bg-green-100 text-green-700 rounded hover:bg-green-200" title="Approve Deletion"><Icon name="check" size={12}/></button>
                                                  <button onClick={() => processRequest(reqFirst.requestId, 'Rejected')} className="p-0.5 bg-red-100 text-red-700 rounded hover:bg-red-200" title="Reject Deletion"><Icon name="x" size={12}/></button>
                                                </div>
                                              ) : null
                                           ) : (
                                              reqFirst ? (
                                                <span className="text-[9px] bg-yellow-100 text-yellow-700 px-1 rounded border border-yellow-200 font-medium ml-1">Pending</span>
                                              ) : (
                                                <button onClick={() => openRequestModal(r.first.id, '1st Half')} className="text-gray-400 hover:text-orange-600 flex items-center ml-1" title="Request Edit">
                                                  <Icon name="pencil" size={12} />
                                                </button>
                                              )
                                           )}

                                        </div>
                                     </div>
                                   </div>
                                 ) : <span className="text-slate-400 text-xs">-</span>}
                              </td>
                              <td className="px-4 py-3">
                                 {r.second ? (
                                   <div className="flex items-center gap-2">
                                     <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                                        r.second.overallGrade.startsWith('A') ? 'bg-green-100 text-green-700' :
                                        r.second.overallGrade === 'B' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'
                                     }`}>{r.second.overallGrade}</div>
                                     <div className="print:hidden">
                                        <div className="flex gap-2 items-center mt-0.5">
                                          {r.second.id && (
                                              <button onClick={() => handleViewReport(r.second.id)} disabled={viewingId === r.second.id} className="text-orange-600 hover:underline text-xs flex items-center gap-1">
                                                {viewingId === r.second.id ? "..." : t('viewPdf')}
                                              </button>
                                          )}
                                          
                                          {portal === 'ADMIN' ? (
                                              reqSecond ? (
                                                <div className="flex gap-1 ml-1">
                                                  <button onClick={() => processRequest(reqSecond.requestId, 'Approved')} className="p-0.5 bg-green-100 text-green-700 rounded hover:bg-green-200" title="Approve Deletion"><Icon name="check" size={12}/></button>
                                                  <button onClick={() => processRequest(reqSecond.requestId, 'Rejected')} className="p-0.5 bg-red-100 text-red-700 rounded hover:bg-red-200" title="Reject Deletion"><Icon name="x" size={12}/></button>
                                                </div>
                                              ) : null
                                           ) : (
                                              reqSecond ? (
                                                <span className="text-[9px] bg-yellow-100 text-yellow-700 px-1 rounded border border-yellow-200 font-medium ml-1">Pending</span>
                                              ) : (
                                                <button onClick={() => openRequestModal(r.second.id, '2nd Half')} className="text-gray-400 hover:text-orange-600 flex items-center ml-1" title="Request Edit">
                                                  <Icon name="pencil" size={12} />
                                                </button>
                                              )
                                           )}

                                        </div>
                                     </div>
                                   </div>
                                 ) : <span className="text-slate-400 text-xs">-</span>}
                              </td>
                              <td className="px-4 py-3">
                                 <div className="flex items-center gap-2">
                                     {overall !== "-" ? (
                                         <span className={`px-3 py-1 rounded font-bold text-sm ${
                                            overall.startsWith('A') ? 'bg-slate-800 text-white' :
                                            overall === 'B' ? 'bg-slate-600 text-white' : 'bg-slate-400 text-white'
                                         }`}>
                                           {overall}
                                         </span>
                                     ) : <span className="text-slate-400">-</span>}
                                     
                                     {(r.first || r.second) && (
                                        <button 
                                          onClick={() => handleViewCombined(r.first?.id, r.second?.id)} 
                                          className={`print:hidden p-1.5 rounded bg-orange-50 text-orange-600 hover:bg-orange-100 transition-colors ${viewingId === `combined-${r.first?.id}-${r.second?.id}` ? 'opacity-50' : ''}`}
                                          disabled={!!viewingId}
                                          title="View Combined Report"
                                        >
                                          {viewingId === `combined-${r.first?.id}-${r.second?.id}` 
                                            ? <div className="loader loader-primary w-3 h-3 border-2"></div> 
                                            : <Icon name="file-text" size={16} />
                                          }
                                        </button>
                                     )}
                                 </div>
                              </td>

                              <td className="px-4 py-3 text-center">
                                 {r.email ? (
                                    <button 
                                       onClick={() => handleSendCombinedEmail(r)} 
                                       disabled={!!sendingRow}
                                       className={`p-1.5 rounded text-white transition-colors ${sendingRow === r.traineeId ? 'bg-gray-400' : 'bg-emerald-500 hover:bg-emerald-600'}`}
                                       title="Send Overall Rating to Employee"
                                    >
                                       {sendingRow === r.traineeId ? <div className="loader w-3 h-3"></div> : <Icon name="mail" size={14} />}
                                    </button>
                                 ) : <span className="text-slate-300 text-xs">No Email</span>}
                              </td>
                              
                              <td className="px-4 py-3 text-center">
                                {rowRequestsCount > 0 ? (
                                   <span className="bg-orange-100 text-orange-700 font-bold px-2 py-1 rounded-full text-xs">{rowRequestsCount}</span>
                                ) : <span className="text-slate-300">-</span>}
                              </td>

                              <td className="px-4 py-3 text-xs text-slate-600">
                                 <div className="max-w-xs truncate" title={r.comments.join("; ")}>{r.comments.join("; ") || "-"}</div>
                              </td>
                            </tr>
                         );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </Card>

          </Layout>
        );
      };

      // --- Main ---
      const App = () => {
        const [page, setPage] = useState('LANDING'); 
        const [portal, setPortal] = useState(null);
        const [user, setUser] = useState(null);
        const [lang, setLang] = useState('en'); 

        const goLogin = (p) => { setPortal(p); setPage('LOGIN'); };
        const goApp = (u) => { setUser(u); setPage('APP'); };
        
        const doLogout = async () => {
          await server.logout(user);
          setUser(null);
          setPortal(null);
          setPage('LANDING');
        };

        const t = (key) => translations[lang][key] || key;
        const ctxVal = { lang, setLang, t };

        let content;
        if(page === 'LANDING') content = <Landing onSelect={goLogin} />;
        else if(page === 'REGISTER') content = <Register onBack={() => setPage('LOGIN')} />;
        else if(page === 'LOGIN') content = <Login portal={portal} onLogin={goApp} onBack={() => setPage('LANDING')} onRegister={() => setPage('REGISTER')} />;
        else if(page === 'APP') content = portal === 'EVALUATION' ? <EvaluationForm user={user} onLogout={doLogout} /> : <Dashboard user={user} onLogout={doLogout} portal={portal} onUpdateUser={(u) => setUser({...user, ...u})} />;

        return (
          <LanguageContext.Provider value={ctxVal}>
            {content}
          </LanguageContext.Provider>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
