                      <th className="px-4 py-3 w-1/6">{t('branch')}</th>
                      <th className="px-4 py-3 w-1/6">{t('firstHalf')}</th>
                      <th className="px-4 py-3 w-1/6">{t('secondHalf')}</th>
                      <th className="px-4 py-3 w-1/6">{t('overallRating')}</th>
                      <th className="px-4 py-3 w-16">{t('requests')}</th>
                      <th className="px-4 py-3 w-1/6">{t('comments')}</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-100">
                    {groupedList.length === 0 ? (
                      <tr><td colSpan="10" className="px-4 py-8 text-center text-gray-500">{t('noData')}</td></tr>
                    ) : (
                      groupedList.map((r, i) => {
                         const s1 = r.first ? getGradeValue(r.first.overallGrade) : 0;
                         const s2 = r.second ? getGradeValue(r.second.overallGrade) : 0;
                         let count = (r.first ? 1 : 0) + (r.second ? 1 : 0);
                         let avg = count ? (s1 + s2) / count : 0;
                         let overall = count ? getGradeLetter(avg) : "-";

                         const reqFirst = r.first ? requests.find(req => req.responseId === r.first.id && req.status === 'Pending') : null;
                         const reqSecond = r.second ? requests.find(req => req.responseId === r.second.id && req.status === 'Pending') : null;
                         
                         const rowRequestsCount = (reqFirst ? 1 : 0) + (reqSecond ? 1 : 0);

                         // Create robust key for this row's combined report button
                         const combinedKey = `combined-${r.first?.id || ''}-${r.second?.id || ''}`;

                         return (
                            <tr key={i} className="hover:bg-zinc-50 transition-colors">
                              <td className="px-4 py-3 text-slate-500">{i + 1}</td>
                              <td className="px-4 py-3 text-slate-700 font-medium">{r.trainerName}</td>
                              <td className="px-4 py-3 text-slate-700 font-mono text-xs">{r.traineeId || '-'}</td>
                              <td className="px-4 py-3">
                                 <div className="font-medium text-slate-900">{r.traineeName}</div>
                                 <div className="text-xs text-slate-500">{r.position}</div>
                              </td>
                              <td className="px-4 py-3 text-slate-600 font-medium">{r.branch}</td>
                              <td className="px-4 py-3">
                                 {r.first ? (
                                   <div className="flex items-center gap-2">
                                     <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                                        r.first.overallGrade.startsWith('A') ? 'bg-green-100 text-green-700' :
                                        r.first.overallGrade === 'B' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'
                                     }`}>{r.first.overallGrade}</div>
                                     <div className="print:hidden">
                                        <div className="flex gap-2 items-center mt-0.5">
                                          {r.first.id && (
                                            <button type="button" onClick={() => handleViewReport(r.first.id)} disabled={viewingId === r.first.id} className="text-orange-600 hover:underline text-xs flex items-center gap-1">
                                               {viewingId === r.first.id ? "..." : t('viewPdf')}
                                            </button>
                                          )}
                                          
                                          {portal === 'ADMIN' ? (
                                              reqFirst ? (
                                                <div className="flex gap-1 ml-1">
                                                  <button type="button" onClick={() => processRequest(reqFirst.requestId, 'Approved')} className="p-0.5 bg-green-100 text-green-700 rounded hover:bg-green-200" title="Approve Deletion"><Icon name="check" size={12}/></button>
                                                  <button type="button" onClick={() => processRequest(reqFirst.requestId, 'Rejected')} className="p-0.5 bg-red-100 text-red-700 rounded hover:bg-red-200" title="Reject Deletion"><Icon name="x" size={12}/></button>
                                                </div>
                                              ) : null
                                           ) : (
                                              reqFirst ? (
                                                <span className="text-[9px] bg-yellow-100 text-yellow-700 px-1 rounded border border-yellow-200 font-medium ml-1">Pending</span>
                                              ) : (
                                                <button type="button" onClick={() => openRequestModal(r.first.id, '1st Half')} className="text-gray-400 hover:text-orange-600 flex items-center ml-1" title="Request Edit">
                                                  <Icon name="pencil" size={12} />
                                                </button>
                                              )
                                           )}

                                        </div>
                                     </div>
                                   </div>
                                 ) : <span className="text-slate-400 text-xs">-</span>}
                              </td>
                              <td className="px-4 py-3">
                                 {r.second ? (
                                   <div className="flex items-center gap-2">
                                     <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${
                                        r.second.overallGrade.startsWith('A') ? 'bg-green-100 text-green-700' :
                                        r.second.overallGrade === 'B' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'
                                     }`}>{r.second.overallGrade}</div>
                                     <div className="print:hidden">
                                        <div className="flex gap-2 items-center mt-0.5">
                                          {r.second.id && (
                                              <button type="button" onClick={() => handleViewReport(r.second.id)} disabled={viewingId === r.second.id} className="text-orange-600 hover:underline text-xs flex items-center gap-1">
                                                {viewingId === r.second.id ? "..." : t('viewPdf')}
                                              </button>
                                          )}
                                          
                                          {portal === 'ADMIN' ? (
                                              reqSecond ? (
                                                <div className="flex gap-1 ml-1">
                                                  <button type="button" onClick={() => processRequest(reqSecond.requestId, 'Approved')} className="p-0.5 bg-green-100 text-green-700 rounded hover:bg-green-200" title="Approve Deletion"><Icon name="check" size={12}/></button>
                                                  <button type="button" onClick={() => processRequest(reqSecond.requestId, 'Rejected')} className="p-0.5 bg-red-100 text-red-700 rounded hover:bg-red-200" title="Reject Deletion"><Icon name="x" size={12}/></button>
                                                </div>
                                              ) : null
                                           ) : (
                                              reqSecond ? (
                                                <span className="text-[9px] bg-yellow-100 text-yellow-700 px-1 rounded border border-yellow-200 font-medium ml-1">Pending</span>
                                              ) : (
                                                <button type="button" onClick={() => openRequestModal(r.second.id, '2nd Half')} className="text-gray-400 hover:text-orange-600 flex items-center ml-1" title="Request Edit">
                                                  <Icon name="pencil" size={12} />
                                                </button>
                                              )
                                           )}

                                        </div>
                                     </div>
                                   </div>
                                 ) : <span className="text-slate-400 text-xs">-</span>}
                              </td>
                              <td className="px-4 py-3">
                                 <div className="flex items-center gap-2">
                                     {overall !== "-" ? (
                                         <span className={`px-3 py-1 rounded font-bold text-sm ${
                                            overall.startsWith('A') ? 'bg-slate-800 text-white' :
                                            overall === 'B' ? 'bg-slate-600 text-white' : 'bg-slate-400 text-white'
                                         }`}>
                                           {overall}
                                         </span>
                                     ) : <span className="text-slate-400">-</span>}
                                     
                                     {(r.first || r.second) && (
                                        <button 
                                          type="button"
                                          onClick={() => handleViewCombined(r.first?.id, r.second?.id)} 
                                          className={`print:hidden p-1.5 rounded bg-orange-50 text-orange-600 hover:bg-orange-100 transition-colors ${viewingId === combinedKey ? 'opacity-50' : ''}`}
                                          disabled={viewingId === combinedKey}
                                          title="View Combined Report"
                                        >
                                          {viewingId === combinedKey
                                            ? <div className="loader loader-primary w-3 h-3 border-2"></div> 
                                            : <span><Icon name="file-text" size={16} /></span>
                                          }
                                        </button>
                                     )}
                                 </div>
                              </td>

                              <td className="px-4 py-3 text-center">
                                {rowRequestsCount > 0 ? (
                                   <span className="bg-orange-100 text-orange-700 font-bold px-2 py-1 rounded-full text-xs">{rowRequestsCount}</span>
                                ) : <span className="text-slate-300">-</span>}
                              </td>

                              <td className="px-4 py-3 text-xs text-slate-600">
                                 <div className="max-w-xs truncate" title={r.comments.join("; ")}>{r.comments.join("; ") || "-"}</div>
                              </td>
                            </tr>
                         );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </Card>

          </Layout>
        );
      };

      const App = () => {
        const [page, setPage] = useState('LANDING'); 
        const [portal, setPortal] = useState(null);
        const [user, setUser] = useState(null);
        const [lang, setLang] = useState('en'); 
        const userRef = useRef(user);

        // Keep user ref synced for event listener
        useEffect(() => { userRef.current = user; }, [user]);

        useEffect(() => {
           // Initialize history state
           if (!window.history.state) {
              window.history.replaceState({ page: 'LANDING', portal: null }, '');
           }

           const handlePopState = (e) => {
              const s = e.state;
              if (s) {
                 // Logic to handle back button from APP state
                 if (s.page === 'APP' && !userRef.current) {
                    // If we go back to APP but have no user (e.g. after logout or deep refresh if persistence existed), 
                    // redirect to Login/Landing.
                    window.history.replaceState({ page: 'LANDING', portal: null }, '');
                    setPage('LANDING');
                    setPortal(null);
                 } else {
                    setPage(s.page || 'LANDING');
                    setPortal(s.portal || null);
                    // Clear user if leaving APP view to ensure security/consistency
                    if (s.page !== 'APP') setUser(null); 
                 }
              } else {
                 setPage('LANDING');
                 setPortal(null);
                 setUser(null);
              }
           };

           window.addEventListener('popstate', handlePopState);
           return () => window.removeEventListener('popstate', handlePopState);
        }, []);

        const navTo = (pg, prtl = null, usr = null) => {
           window.history.pushState({ page: pg, portal: prtl }, '');
           setPage(pg);
           setPortal(prtl);
           if (pg === 'APP' && usr) setUser(usr);
        };

        const goLogin = (p) => navTo('LOGIN', p);
        
        const goRegister = () => navTo('REGISTER', portal);

        const goApp = (u) => navTo('APP', portal, u);
        
        const doLogout = async () => {
          await server.logout(user);
          setUser(null);
          setPortal(null);
          // Push landing state
          window.history.pushState({ page: 'LANDING', portal: null }, '');
          setPage('LANDING');
        };
        
        const goBack = () => {
           window.history.back();
        };

        const t = (key) => translations[lang][key] || key;
        const ctxVal = { lang, setLang, t };

        let content;
        if(page === 'LANDING') content = <Landing onSelect={goLogin} />;
        else if(page === 'REGISTER') content = <Register onBack={goBack} />;
        else if(page === 'LOGIN') content = <Login portal={portal} onLogin={goApp} onBack={goBack} onRegister={goRegister} />;
        else if(page === 'APP') content = portal === 'EVALUATION' ? <EvaluationForm user={user} onLogout={doLogout} /> : <Dashboard user={user} onLogout={doLogout} portal={portal} onUpdateUser={(u) => setUser({...user, ...u})} />;

        return (
          <LanguageContext.Provider value={ctxVal}>
            <ToastProvider>
              <DialogProvider>
                {content}
              </DialogProvider>
            </ToastProvider>
          </LanguageContext.Provider>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
