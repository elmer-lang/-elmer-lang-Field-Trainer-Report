      // --- TOAST CONTEXT ---
      const ToastContext = createContext();
      const useToast = () => useContext(ToastContext);

      const ToastProvider = ({ children }) => {
        const [toasts, setToasts] = useState([]);
        const addToast = (msg, type = 'success') => {
          const id = Date.now();
          setToasts(prev => [...prev, { id, msg, type }]);
          setTimeout(() => removeToast(id), 4000);
        };
        const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

        return (
          <ToastContext.Provider value={{ addToast }}>
            {children}
            <div className="fixed top-4 right-4 z-[100] flex flex-col gap-2">
              {toasts.map(t => (
                <div key={t.id} className={`flex items-center gap-3 p-4 rounded-lg shadow-lg border animate-fade ${
                  t.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 
                  t.type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-800' :
                  'bg-emerald-50 border-emerald-200 text-emerald-800'
                }`}>
                  <Icon name={t.type === 'error' ? 'alert-octagon' : t.type === 'warning' ? 'alert-triangle' : 'check-circle'} size={20} />
                  <span className="text-sm font-medium">{t.msg}</span>
                  <button type="button" onClick={() => removeToast(t.id)} className="opacity-50 hover:opacity-100"><Icon name="x" size={16} /></button>
                </div>
              ))}
            </div>
          </ToastContext.Provider>
        );
      };

      // --- DIALOG CONTEXT ---
      const DialogContext = createContext();
      const useDialog = () => useContext(DialogContext);

      const DialogProvider = ({ children }) => {
        const [dialog, setDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
        const confirm = (config) => setDialog({ ...config, isOpen: true });
        const close = () => setDialog(prev => ({ ...prev, isOpen: false }));

        return (
          <DialogContext.Provider value={{ confirm }}>
            {children}
            <ConfirmDialog 
              isOpen={dialog.isOpen} 
              title={dialog.title} 
              message={dialog.message} 
              onConfirm={() => { if(dialog.onConfirm) dialog.onConfirm(); close(); }} 
              onCancel={close} 
            />
          </DialogContext.Provider>
        );
      };

      const ConfirmDialog = ({ isOpen, title, message, onConfirm, onCancel, isLoading }) => {
        if (!isOpen) return null;
        return (
          <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade">
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6">

                <button type="button" onClick={onConfirm} disabled={isLoading} className="flex-1 py-2 rounded-lg bg-orange-600 text-white hover:bg-orange-700 font-medium flex justify-center items-center gap-2">
                  {isLoading ? <div className="loader w-4 h-4"></div> : 'Confirm'}
                </button>
              </div>
            </div>
          </div>
        );

      // --- UTILS: Client Side Resizing ---
      function resizeImage(file, maxWidth = 1280) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const reader = new FileReader();

            reader.onload = (e) => {
                img.src = e.target.result;
            };
            reader.onerror = reject;

            img.onload = () => {
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    const scale = maxWidth / width;
                    width = maxWidth;
                    height = height * scale;
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                
                resolve(canvas.toDataURL("image/jpeg", 0.8));
            };
            img.onerror = reject;

            reader.readAsDataURL(file);
        });
      }

      const Combobox = ({ label, value, onChange, options, placeholder, required }) => {
        const [isOpen, setIsOpen] = useState(false);
        const { t, lang } = useTranslation();
        const containerRef = useRef(null);

        // Filter options based on current value
        const filteredOptions = options.filter(o => 
           !value || String(o).toLowerCase().includes(String(value).toLowerCase())
        );

        const handleSelect = (val) => {
           onChange({ target: { value: val } });
           setIsOpen(false);
        };

        useEffect(() => {
           const handleClickOutside = (event) => {
             if (containerRef.current && !containerRef.current.contains(event.target)) {
               setIsOpen(false);
             }
           };
           document.addEventListener("mousedown", handleClickOutside);
           return () => document.removeEventListener("mousedown", handleClickOutside);
        }, [containerRef]);

        return (
          <div className="mb-4 relative" ref={containerRef}>

      const ImageUploadModal = ({ isOpen, onClose, onSave }) => {
        const { t } = useTranslation();
        const [mode, setMode] = useState('UPLOAD'); // UPLOAD | CAMERA
        const [preview, setPreview] = useState(null);
        const [loading, setLoading] = useState(false);
        const [stream, setStream] = useState(null);
        const videoRef = useRef(null);
        const canvasRef = useRef(null);

        useEffect(() => {
           if (!isOpen) {
             stopCamera();
             setPreview(null);
             setMode('UPLOAD');
           }
        }, [isOpen]);

        const stopCamera = () => {
           if (stream) {
              stream.getTracks().forEach(track => track.stop());
              setStream(null);
           }
        };

        const startCamera = async () => {
           setMode('CAMERA');
           setPreview(null);
           try {
              const s = await navigator.mediaDevices.getUserMedia({ video: true });
              setStream(s);
              if (videoRef.current) videoRef.current.srcObject = s;
           } catch(e) {
              alert(t('noCamera') + ": " + e.message);
              setMode('UPLOAD');
           }
        };

        const handleFileChange = async (e) => {
           const file = e.target.files[0];
           if (file) {
              try {
                  const resized = await resizeImage(file, 800);
                  setPreview(resized);
              } catch(e) {
                  alert("Error processing image");
              }
           }
        };

        const capture = () => {
           if (videoRef.current && canvasRef.current) {
               const video = videoRef.current;
               const canvas = canvasRef.current;
               canvas.width = video.videoWidth;
               canvas.height = video.videoHeight;
               const ctx = canvas.getContext('2d');
               ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
               const data = canvas.toDataURL('image/jpeg', 0.8);
               setPreview(data);
               stopCamera();
           }
        };

        const saveImage = async () => {
           if (!preview) return;
           setLoading(true);
           try {
              await onSave(preview);
              onClose();
           } catch(e) {
              alert(e.message);
           } finally {
              setLoading(false);
           }
        };

        if (!isOpen) return null;

        return (
           <Modal title={t('changePhoto')} onClose={onClose}>
              <div className="flex gap-2 mb-4">
                 <button type="button" onClick={() => { stopCamera(); setMode('UPLOAD'); }} className={`flex-1 py-2 text-sm font-bold rounded-lg ${mode === 'UPLOAD' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                    <div className="flex items-center justify-center gap-2"><Icon name="upload" size={16} /> {t('upload')}</div>
                 </button>
                 <button type="button" onClick={startCamera} className={`flex-1 py-2 text-sm font-bold rounded-lg ${mode === 'CAMERA' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-600'}`}>
                    <div className="flex items-center justify-center gap-2"><Icon name="camera" size={16} /> {t('camera')}</div>
                 </button>
              </div>

              <div className="bg-zinc-100 rounded-lg aspect-square flex items-center justify-center overflow-hidden mb-4 relative border border-zinc-200">
                 {mode === 'UPLOAD' && !preview && (
                    <label className="cursor-pointer flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-orange-500 transition-colors">
                       <Icon name="image-plus" size={48} />
                       <span className="text-xs mt-2 font-medium">{t('clickSelectImage')}</span>
                       <input type="file" className="hidden" accept="image/*" onChange={handleFileChange} />
                    </label>
                 )}
                 
                 {mode === 'CAMERA' && !preview && (
                    <div className="relative w-full h-full bg-black">
                       <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover transform scale-x-[-1]" />
                       <canvas ref={canvasRef} className="hidden" />
                       <button type="button" onClick={capture} className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-white rounded-full p-4 shadow-lg hover:scale-105 transition-transform">
                          <div className="w-4 h-4 bg-red-500 rounded-full"></div>
                       </button>
                    </div>
                 )}

                 {preview && (
                    <div className="relative w-full h-full">
                       <img src={preview} alt="Preview" className="w-full h-full object-cover" />
                       <button type="button" onClick={() => { setPreview(null); if(mode==='CAMERA') startCamera(); }} className="absolute top-2 right-2 bg-black/50 text-white p-2 rounded-full hover:bg-black/70">
                          <Icon name="rotate-ccw" size={16} />
                       </button>
                    </div>
                 )}
              </div>

              <div className="flex gap-2">
                 <Button variant="secondary" onClick={onClose} disabled={loading}>{t('cancel')}</Button>
                 <Button onClick={saveImage} isLoading={loading} disabled={!preview}>{t('save')}</Button>
              </div>
           </Modal>
        );
      };

      const ResetPasswordModal = ({ onClose }) => {
         const { t } = useTranslation();
         const [step, setStep] = useState(1); // 1: ID, 2: OTP
         const [id, setId] = useState('');
         const [otp, setOtp] = useState('');
         const [newPass, setNewPass] = useState('');
         const [confirmPass, setConfirmPass] = useState('');
         const [loading, setLoading] = useState(false);
         const [msg, setMsg] = useState(null);

         const handleSendCode = async () => {
            if(!id) return;
            setLoading(true); setMsg(null);
            try {
               await server.requestPasswordReset(id);
               setStep(2);
               setMsg({ type: 'success', text: t('codeSent') });
            } catch(e) {
               setMsg({ type: 'error', text: e.message });
            } finally {
               setLoading(false);
            }
         };

         const handleSubmit = async () => {
            if(!otp || !newPass || !confirmPass) return;
            if(newPass !== confirmPass) { setMsg({type:'error', text: "Passwords do not match"}); return; }
            
            setLoading(true); setMsg(null);
            try {
               await server.resetPassword(id, otp, newPass);
               setMsg({ type: 'success', text: t('passChanged') });
               setTimeout(onClose, 2000);
            } catch(e) {
               setMsg({ type: 'error', text: e.message });
            } finally {
               setLoading(false);
            }
         };

         return (
            <Modal title={t('resetPass')} onClose={onClose}>
               {msg && <Alert type={msg.type} message={msg.text} />}
               
               {step === 1 ? (
                  <>
                     <Input label={t('enterId')} value={id} onChange={e => setId(e.target.value)} placeholder="e.g. 1001" />

        const getTitle = () => {
          if (portal === 'EVALUATION') return t('evalPortal');
          if (portal === 'ADMIN') return t('adminPortal');
          return t('trainerTracker');
        };

        const getIconColor = () => {
          if (portal === 'EVALUATION') return 'bg-orange-100 text-orange-600';
          if (portal === 'ADMIN') return 'bg-zinc-200 text-zinc-700';

            const user = await server.login(id, pass, portal);
            // Permission Check for Admin Portal
            if (portal === 'ADMIN' && user.role !== 'ADMIN') {
              throw new Error("Access Denied: You do not have Administrator privileges.");
            }
            onLogin(user);
            addToast(t('welcomeBack'), 'success');
          } catch(e) { 
             addToast(e.message || "Invalid Credentials.", 'error'); 
          } finally { 
             setLoading(false); 
          }
        };

        return (
          <Layout title={getTitle()} onBack={onBack}>
            <div className="max-w-md mx-auto mt-10">
              <Card>
                <div className="text-center mb-6">
                  <div className={`w-12 h-12 mx-auto rounded-full flex items-center justify-center mb-3 ${getIconColor()}`}>
                    <Icon name={portal === 'ADMIN' ? 'shield' : 'user'} />
                  </div>
                  <h2 className="text-xl font-bold">{t('welcomeBack')}</h2>
                  {portal === 'ADMIN' && <p className="text-xs text-slate-500 mt-1">{t('restricted')}</p>}
                </div>
                <form onSubmit={handleSubmit}>
                  <Input label={t('idNumber')} value={id} onChange={e => setId(e.target.value)} required />
                  
                  <div className="mb-4">
                    <label className="block text-sm font-medium text-slate-700 mb-1">{t('password')}</label>
                    <div className="relative">
                      <input 
                        type={showPass ? "text" : "password"} 
                        value={pass} 
                        onChange={e => setPass(e.target.value)} 
                        className={`w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none ${lang === 'ar' ? 'pl-10' : 'pr-10'}`}
                        required 
                      />
                      <button type="button" onClick={() => setShowPass(!showPass)} className={`absolute top-2.5 text-gray-400 hover:text-gray-600 ${lang === 'ar' ? 'left-3' : 'right-3'}`}>
                        <Icon name={showPass ? "eye-off" : "eye"} size={18} />
                      </button>
                    </div>
                  </div>

                  <div className="flex justify-end mb-4 -mt-2">
                      <button type="button" onClick={() => setResetOpen(true)} className="text-xs text-orange-600 hover:underline">{t('forgotPass')}</button>
                  </div>

                  <Button type="submit" isLoading={loading} className="mt-2">{t('login')}</Button>
                </form>
                {/* Only Show Register for Evaluation Portal */}
                {portal === 'EVALUATION' && (
                  <div className="mt-4 text-center">
                    <button type="button" onClick={onRegister} className="text-sm text-orange-600 hover:underline">{t('registerNew')}</button>
                  </div>
                )}
              </Card>
            </div>
            
            {resetOpen && <ResetPasswordModal onClose={() => setResetOpen(false)} />}
          </Layout>
        );
      };

      const Register = ({ onBack }) => {
        const { t } = useTranslation();
        const { addToast } = useToast();
        const [form, setForm] = useState({ name:'', idNumber:'', password:'', position:'', email:'' });
        const [loading, setLoading] = useState(false);
        const [showSuccessModal, setShowSuccessModal] = useState(false);

        const handleSubmit = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            await server.submitRegistration({...form, branch: "TBD"});
            setShowSuccessModal(true);
          } catch(e) { 
            addToast(e.message, 'error'); 
          } finally { 
            setLoading(false); 
          }
        };

        return (
          <Layout title={t('registerNew')} onBack={onBack}>
            <div className="max-w-md mx-auto mt-4">
              <Card>
                <form onSubmit={handleSubmit}>
                  <Input label={t('fullName')} value={form.name} onChange={e => setForm({...form, name:e.target.value})} required />
                  {/* ID Validation: 4 Digits */}
                  <div className="mb-4">
                     <label className="block text-sm font-medium text-slate-700 mb-1">{t('id4Digits')}</label>
                     <input 
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none" 
                        value={form.idNumber} 
                        onChange={e => {
                           const val = e.target.value.replace(/\D/g, '').slice(0, 4);
                           setForm({...form, idNumber:val});
                        }}
                        pattern="\d{4}"
                        required 
                     />
                  </div>
                  <Input label={t('password')} type="password" value={form.password} onChange={e => setForm({...form, password:e.target.value})} required />
                  <Select label={t('position')} value={form.position} onChange={e => setForm({...form, position:e.target.value})} options={[{label:'Trainer', value:'Trainer'}, {label:'Team Leader', value:'TL'}, {label:'Admin', value:'Admin'}]} required />
                  <Input label={t('email')} type="email" value={form.email} onChange={e => setForm({...form, email:e.target.value})} required />
                  
                  <Button type="submit" isLoading={loading} className="mt-4">{t('register')}</Button>
                </form>
              </Card>
            </div>

            {showSuccessModal && (
               <Modal title="Registration Submitted" onClose={onBack}>
                  <div className="text-center">
                     <div className="mx-auto w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4">
                        <Icon name="check" size={24} />
                     </div>
                     <h3 className="text-lg font-bold text-slate-800 mb-2">Request Sent!</h3>
                     <p className="text-slate-600 mb-6 text-sm">{t('regSuccess')}</p>
                     <Button onClick={onBack}>Return to Login</Button>
                  </div>
               </Modal>
            )}
          </Layout>
        );
      };

      const EvaluationForm = ({ user, onLogout }) => {
        const { t, lang } = useTranslation();
        const { addToast } = useToast();
        const [loading, setLoading] = useState(true);
        const [db, setDb] = useState([]);
        const [qs, setQs] = useState([]);
        const [form, setForm] = useState({ traineeName:'', traineeId:'', email: '', evaluationType:'1st Half', position:'Team Member', trainerName:'', branch:'', teamLeader:'', area:'', overallGrade:'A', scores:{} });
        const [statusData, setStatusData] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [calculation, setCalculation] = useState({ totalScore: 0, letterGrade: 'D', categoryScores: {} });
        const [alertMsg, setAlertMsg] = useState(null); 
        
        // Lookup Options
        const [traineeOptions, setTraineeOptions] = useState([]);
        const [branchOptions, setBranchOptions] = useState([]);
        
        const [pdfResult, setPdfResult] = useState(null);

        const gradeMeta = {
          "A+": { text: t('gradeApDesc'), stars: "⭐⭐⭐⭐⭐" },
          "A":  { text: t('gradeADesc'), stars: "⭐⭐⭐⭐" },
          "B":  { text: t('gradeBDesc'), stars: "⭐⭐⭐" },
          "C":  { text: t('gradeCDesc'), stars: "⭐⭐" },
          "D":  { text: t('gradeDDesc'), stars: "⭐" },
          "-":  { text: t('pending'), stars: "" }
        };

        useEffect(() => {
          Promise.all([server.getFTDatabase(), server.getQuestions()]).then(([d, q]) => {
            setDb(d); 
            setQs(q); 
            
            // Extract all branches for the datalist, sorted
            const allBranches = [...new Set(d.map(r => r.branch).filter(Boolean))].sort();
            setBranchOptions(allBranches);
            
            setLoading(false);
          });
          
          if (user) {
             setForm(f => ({...f, trainerName: user.name}));
             // Default branch setting removed to ensure manual selection
          }
        }, []);
        
        useEffect(() => {
           if (!db.length) return;
           const map = new Map();
           db.forEach(r => {
              if (r.traineeId) map.set(String(r.traineeId), r.traineeName);
           });
           setTraineeOptions(Array.from(map.entries()).map(([id, name]) => ({ id, name })));
        }, [db]);

        const handleIdChange = (e) => {
           const val = e.target.value;
           const match = traineeOptions.find(o => o.id === val);
           setForm(f => ({
               ...f, 
               traineeId: val,
               traineeName: match ? match.name : f.traineeName 
           }));
           if (match) checkId(val);
        };

        const handleBranchChange = (e) => {
           const b = e.target.value;
           
           // Search db for any row with this branch to auto-fill TL and Area
           // Logic modified to search globally, not restricted to the trainer
           const row = db.find(r => r.branch === b);
           
           setForm(f => ({
             ...f, 
             branch: b, 
             teamLeader: row?.teamLeader || '', 
             area: row?.area || ''
           }));
        };

        useEffect(() => {
          if (!qs.length) return;
          
          const gradeValues = { "A+": 100, "A": 90, "B": 80, "C": 70, "D": 60 };
          const categories = {};
          
          qs.forEach(q => {
            if (q.type === 'radio' || q.type === 'dropdown') {
              const answer = form.scores[q.id];
              const score = gradeValues[answer] || 0;
              if (answer) {
                if (!categories[q.category]) categories[q.category] = { sum: 0, count: 0 };
                categories[q.category].sum += score;
                categories[q.category].count++;
              }
            }
          });

          let totalSum = 0;
          let totalCount = 0;
          const catScores = {};

          Object.keys(categories).forEach(cat => {
            const avg = categories[cat].sum / categories[cat].count;
            catScores[cat] = Math.round(avg);
            totalSum += avg; 
            totalCount++; 
          });

          const grandAvg = totalCount > 0 ? totalSum / totalCount : 0;
          let letter = 'D';
          if (grandAvg >= 98) letter = 'A+';
          else if (grandAvg >= 90) letter = 'A';
          else if (grandAvg >= 80) letter = 'B';
          else if (grandAvg >= 70) letter = 'C';
          else letter = 'D';

          setCalculation({ totalScore: Math.round(grandAvg), letterGrade: letter, categoryScores: catScores });
          setForm(f => ({ ...f, overallGrade: letter }));
        }, [form.scores, qs]);

        const checkId = async (specificId) => {
          const targetId = specificId || form.traineeId;
          if(!targetId) return;
          
          setAlertMsg(null);
          setStatusData(null);
          
          try {
            const res = await server.checkPrev(targetId);
            if(res && res.found) { 
              setStatusData(res);
              setForm(f => ({
                ...f, 
                traineeName: res.traineeName || f.traineeName,
                position: res.position || f.position,
                email: res.email || f.email
              })); 

              if (res.completed) {
                  setAlertMsg({ type: 'error', msg: "Evaluation Complete" });
              } else if (res.first) {
                 setAlertMsg({ type: 'success', msg: "1st Half Found" });
                 setForm(f => ({ ...f, evaluationType: '2nd Half' }));
              }
            }
          } catch(e) { console.error(e); }
        };

        const submit = async (e) => {
          e.preventDefault();
          if (statusData && statusData.completed) {
             addToast("Cannot submit: Both evaluations are already completed for this month.", 'error');
             return;
          }
          setSubmitting(true);
          setAlertMsg(null);
          try { 
             const result = await server.submit(form); 
             setPdfResult(result);
             addToast("Evaluation Submitted Successfully", 'success');
          }
          catch(e) { setAlertMsg({ type: 'error', msg: "Error: "+e.message }); }
          setSubmitting(false);
        };

        const resetForm = () => {
            setPdfResult(null);
            setForm(f => ({ 
               ...f, 
               traineeId: '', 
               traineeName: '', 
               email: '',
               scores: {}, 
               evaluationType: '1st Half',
               overallGrade: 'A' 
            }));
            setStatusData(null);
            setAlertMsg(null);
        };
        
        const downloadPdf = () => {
           if(!pdfResult || !pdfResult.base64) return;
           const link = document.createElement('a');
           link.href = `data:application/pdf;base64,${pdfResult.base64}`;
           link.download = `${form.traineeId}-${form.traineeName}.pdf`;
           document.body.appendChild(link);
           link.click();
           document.body.removeChild(link);
        };

        const openPreview = () => {
           if(!pdfResult || !pdfResult.base64) {
             addToast("PDF data not available.", 'error');
             return;
           }
           try {
             const byteCharacters = atob(pdfResult.base64);
             const byteNumbers = new Array(byteCharacters.length);
             for (let i = 0; i < byteCharacters.length; i++) {
                 byteNumbers[i] = byteCharacters.charCodeAt(i);
             }
             const byteArray = new Uint8Array(byteNumbers);
             const file = new Blob([byteArray], { type: 'application/pdf' });
             const fileURL = URL.createObjectURL(file);
             window.open(fileURL, '_blank');
           } catch(e) {
             addToast("Could not open preview: " + e.message, 'error');
           }
        };

        const getSummaryStyle = (grade) => {
            const base = "border-none text-slate-900 transition-colors duration-300"; 
            if (grade.startsWith('A')) return `${base} bg-emerald-400`; 
            if (grade === 'B') return `${base} bg-yellow-400`; 
            if (grade === 'C') return `${base} bg-orange-400`; 
            return `${base} bg-red-400`; 
        };

        if(loading) return <div className="flex justify-center p-10"><div className="loader loader-primary"></div></div>;

        if (pdfResult) {
            return (
              <Layout title={t('evalComplete')} user={user} onLogout={onLogout}>
                  <div className="max-w-md mx-auto mt-10 text-center animate-fade">
                      <Card className="border-t-4 border-emerald-500">
                          <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                              <Icon name="check" size={32} className="text-emerald-600" />
                          </div>
                          <h2 className="text-2xl font-bold text-slate-800 mb-2">{t('evalComplete')}</h2>
                          <p className="text-slate-500 mb-6">{t('evalSaved')}</p>
                          
                          <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <button type="button" onClick={openPreview} className="w-full py-3 px-4 bg-orange-600 text-white rounded-lg font-medium hover:bg-orange-700 flex items-center justify-center gap-2 transition-colors shadow-sm">
                                   <Icon name="eye" size={20}/> {t('preview')}
                                </button>
                                <button type="button" onClick={downloadPdf} className="w-full py-3 px-4 bg-slate-800 text-white rounded-lg font-medium hover:bg-slate-900 flex items-center justify-center gap-2 transition-colors shadow-sm">
                                   <Icon name="download" size={20}/> {t('download')}
                                </button>
                            </div>
                            
                            <div className="text-sm bg-zinc-50 p-4 rounded-lg border border-zinc-200">
                              <p className="text-slate-600 mb-1">{t('driveStatus')}</p>
                              {pdfResult.url && !pdfResult.url.startsWith("Error") ? (
                                <a href={pdfResult.url} target="_blank" className="text-orange-600 hover:text-orange-800 font-medium inline-flex items-center gap-1 break-all">
                                  {t('openDrive')} <Icon name="external-link" size={14} />
                                </a>
                              ) : (
                                <span className="text-red-500 text-xs">{pdfResult.url}</span>
                              )}
                            </div>

                            <Button onClick={resetForm} variant="secondary">{t('evalAnother')}</Button>
                          </div>
                      </Card>
                  </div>
              </Layout>
            );
        }

        const filteredQs = qs.filter(q => q.targetPosition === 'Both' || q.targetPosition === form.position);
        
        return (
          <Layout title={t('evalForm')} user={user} onLogout={onLogout}>
            <form onSubmit={submit} className="max-w-3xl mx-auto space-y-6">
              
              <div className="bg-white p-4 rounded-xl border border-zinc-200 text-sm grid grid-cols-2 md:grid-cols-5 gap-2 text-center shadow-sm">
                <div className="bg-green-50 text-green-800 p-1 rounded"><strong>A+</strong> {t('excellent')}</div>
                <div className="bg-blue-50 text-blue-800 p-1 rounded"><strong>A</strong> {t('exceeds')}</div>
                <div className="bg-yellow-50 text-yellow-800 p-1 rounded"><strong>B</strong> {t('meets')}</div>
                <div className="bg-orange-50 text-orange-800 p-1 rounded"><strong>C</strong> {t('inconsistent')}</div>
                <div className="bg-red-50 text-red-800 p-1 rounded"><strong>D</strong> {t('unsatisfactory')}</div>
              </div>
              
              {statusData && (
                 <div className="grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade">
                    <div className={`p-4 rounded-xl border-l-4 shadow-sm ${statusData.first ? 'bg-white border-green-500' : 'bg-zinc-50 border-zinc-300'}`}>
                       <div className="flex justify-between items-start">
                          <div>
                            <p className="text-xs font-bold uppercase text-slate-500 mb-1">{t('firstHalf')}</p>
                            {statusData.first ? (
                               <div>
                                  <p className="text-sm font-bold text-slate-800 leading-tight mb-1">
                                     {statusData.first.grade} = {gradeMeta[statusData.first.grade]?.text}
                                  </p>
                                  <p className="text-xs text-slate-600 flex items-center gap-1 mb-1">
                                     {gradeMeta[statusData.first.grade]?.stars}
                                  </p>
                                  <p className="text-xs text-slate-500">
                                     {t('dateLabel')} {new Date(statusData.first.date).toLocaleDateString('en-GB')}
                                  </p>
                                </div>
                            ) : (
                               <p className="text-2xl font-bold text-slate-400">{t('pending')}</p>
                            )}
                          </div>
                          {statusData.first && <Icon name="check-circle" className="text-green-500" />}
                       </div>
                    </div>
                    <div className={`p-4 rounded-xl border-l-4 shadow-sm ${statusData.second ? 'bg-white border-green-500' : 'bg-zinc-50 border-zinc-300'}`}>
                       <div className="flex justify-between items-start">
                          <div>
                            <p className="text-xs font-bold uppercase text-slate-500 mb-1">{t('secondHalf')}</p>
                            {statusData.second ? (
                               <div>
                                  <p className="text-sm font-bold text-slate-800 leading-tight mb-1">
                                     {statusData.second.grade} = {gradeMeta[statusData.second.grade]?.text}
                                  </p>
                                  <p className="text-xs text-slate-600 flex items-center gap-1 mb-1">
                                     {gradeMeta[statusData.second.grade]?.stars}
                                  </p>
                                  <p className="text-xs text-slate-500">
                                     {t('dateLabel')} {new Date(statusData.second.date).toLocaleDateString('en-GB')}
                                  </p>
                               </div>
                            ) : (
                               <p className="text-2xl font-bold text-slate-400">{t('pending')}</p>
                            )}
                          </div>
                          {statusData.second && <Icon name="check-circle" className="text-green-500" />}
                       </div>
                    </div>
                 </div>
              )}

              {alertMsg && <Alert type={alertMsg.type} message={alertMsg.msg} />}

              <Card title={t('traineeInfo')} className="overflow-visible">
                <div className="grid md:grid-cols-2 gap-4">
                   <div className="relative">
                     <label className="block text-sm font-medium text-slate-700 mb-1">{t('traineeID')}</label>
                     <input 
                        list="traineeList" 
                        value={form.traineeId} 
                        onChange={handleIdChange} 
                        onBlur={() => checkId()} 
                        className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none"
                        required 
                     />
                     <datalist id="traineeList">
                        {traineeOptions.map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                     </datalist>
                   </div>
                   
                   <Input label={t('traineeName')} value={form.traineeName} onChange={e => setForm({...form, traineeName:e.target.value})} readOnly={statusData || traineeOptions.some(o => o.id === form.traineeId)} className={statusData ? 'bg-zinc-100' : ''} required />
                   
                   <div className="mb-4">
                       <label className="block text-sm font-medium text-slate-700 mb-1">
                          {t('email')} <span className="text-red-500">*</span>
                       </label>
                       <div className="relative">
                         <input
                            type="email"
                            value={form.email}
                            onChange={e => setForm({...form, email: e.target.value})}
                            list="emailOptions"
                            className="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:outline-none"
                            required
                            placeholder={t('selectEmail')}
                         />
                         <div className={`absolute top-2.5 pointer-events-none text-gray-400 ${lang === 'ar' ? 'left-3' : 'right-3'}`}>
                            <Icon name="chevron-down" size={16} />
                         </div>
                       </div>
                       <datalist id="emailOptions">
                          {form.traineeId && <option value={`${form.traineeId}@newboncafe.com`}/>}
                          <option value="@gmail.com" />
                          <option value="@outlook.com" />
                          <option value="@yahoo.com" />
                       </datalist>
                   </div>

                   <Select label={t('evalType')} value={form.evaluationType} onChange={e => setForm({...form, evaluationType:e.target.value})} options={[{label:t('firstHalf'), value:'1st Half'}, {label:t('secondHalf'), value:'2nd Half'}]} required />
                   
                   <Select label={t('position')} value={form.position} onChange={e => setForm({...form, position:e.target.value})} options={[{label:t('teamMember'), value:'Team Member'}, {label:t('teamLeader'), value:'Team Leader'}]} required />
                   
                   <Input label={t('trainerName')} value={form.trainerName} readOnly className="bg-zinc-100 font-semibold text-slate-700" />
                   
                   <Combobox 
                      label={t('branch')} 
                      value={form.branch} 
                      onChange={handleBranchChange} 
                      options={branchOptions}
                      placeholder={t('selectBranch')}
                      required={true}
                   />
                </div>
              </Card>

              {Object.entries(filteredQs.reduce((a,q) => (a[q.category] = [...(a[q.category]||[]), q], a), {})).map(([cat, qList]) => (
                <Card 
                    key={cat} 
                    title={`${cat} (Avg: ${calculation.categoryScores[cat] || 0}%)`}
                    className="border-2 border-orange-500 shadow-md"
                    titleClass="bg-orange-50 text-orange-900"
                >
                  {qList.map(q => (
                    <div key={q.id} className="mb-4 pb-4 border-b border-zinc-100 last:border-0 last:mb-0 last:pb-0">
                      <p className="font-medium mb-2">{q.text}</p>
                      {q.type === 'radio' ? (
                        <div className="flex gap-4 flex-wrap">
                          {q.options.map(o => (
                            <label key={o} className="flex items-center gap-1 cursor-pointer hover:bg-zinc-50 p-1 rounded">
                              <input type="radio" name={q.id} checked={form.scores[q.id] === o} onChange={() => setForm(f => ({...f, scores: {...f.scores, [q.id]: o}}))} className="text-orange-600" required />
                              <span className="font-bold text-sm">{o}</span>
                            </label>
                          ))}
                        </div>
                      ) : q.type === 'dropdown' ? (
                        <select 
                          className="w-full border border-zinc-300 rounded p-2 text-sm focus:ring-2 focus:ring-orange-500 bg-white"
                          value={form.scores[q.id] || ''}
                          onChange={e => setForm(f => ({...f, scores: {...f.scores, [q.id]: e.target.value}}))}
                          required
                        >
                          <option value="">{t('select')}</option>
                          {q.options.map(o => (
                            <option key={o} value={o}>{o}</option>
                          ))}
                        </select>
                      ) : (
                        <textarea className="w-full border rounded p-2 text-sm" rows="2" onChange={e => setForm(f => ({...f, scores: {...f.scores, [q.id]: e.target.value}}))} required></textarea>
                      )}
                    </div>
                  ))}
                </Card>
              ))}

              <Card title="Evaluation Summary" className={getSummaryStyle(calculation.letterGrade)} titleClass="text-slate-900/70 border-slate-900/10">
                 <div className="flex justify-between items-center">
                   <div>
                     <p className="text-slate-900/60 text-sm uppercase font-bold">{t('totalScore')}</p>
                     <p className="text-4xl font-bold text-slate-900">{calculation.totalScore}%</p>
                   </div>
                   <div className="text-right">
                     <p className="text-slate-900/60 text-sm uppercase font-bold">{t('overallRating')}</p>
                     <div className={`text-4xl font-bold px-4 py-1 rounded inline-block mt-1 bg-black/10 text-slate-900`}>
                       {calculation.letterGrade}
                     </div>
                   </div>
                 </div>
                 <Button type="submit" isLoading={submitting} disabled={statusData && statusData.completed} className="mt-6 py-4 text-lg bg-slate-900 hover:bg-slate-800 text-white border-none">{t('submit')}</Button>
              </Card>
            </form>
          </Layout>
        );
      };

      const Dashboard = ({ user, onLogout, portal, onUpdateUser }) => {
        const { t, lang } = useTranslation();
        const { addToast } = useToast();
        const { confirm } = useDialog();
        const [stats, setStats] = useState(null);
        const [requests, setRequests] = useState([]); 
        const [regRequests, setRegRequests] = useState([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState(null);
        const [viewingId, setViewingId] = useState(null);

        const [isEditModalOpen, setEditModalOpen] = useState(false);
        const [editTarget, setEditTarget] = useState(null);
        const [editReason, setEditReason] = useState("");
        const [isSubmittingRequest, setSubmittingRequest] = useState(false);
        const [isImageModalOpen, setImageModalOpen] = useState(false);

        const [dateFrom, setDateFrom] = useState('');
        const [dateTo, setDateTo] = useState('');
        const [filterPosition, setFilterPosition] = useState('All');
        
        const [selectedNames, setSelectedNames] = useState([]);
        const [selectedBranches, setSelectedBranches] = useState([]);
        const [selectedGrades, setSelectedGrades] = useState([]);
        const [selectedTrainers, setSelectedTrainers] = useState([]);

        const loadData = () => {
           setLoading(true);
           const promises = [
              server.getStats(),
              server.getRequests(portal === 'ADMIN' ? 'ADMIN' : 'TRAINER', user.name)
           ];
           
           if (portal === 'ADMIN') {
               promises.push(server.getRegistrationRequests());
           }

           Promise.all(promises)
           .then((results) => {
              setStats(results[0]);
              setRequests(results[1]);
              if (portal === 'ADMIN') setRegRequests(results[2] || []);
              setLoading(false);
           })
           .catch(err => {
              setError(err.message);
              setLoading(false);
           });
        };

        useEffect(() => { 
          const now = new Date();
          const firstDay = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
          const lastDayObj = new Date(now.getFullYear(), now.getMonth() + 1, 0);
          const lastDay = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(lastDayObj.getDate()).padStart(2, '0')}`;
          
          setDateFrom(firstDay);
          setDateTo(lastDay);

          loadData();
        }, []);
        
        const getGradeValue = (g) => ({ "A+": 100, "A": 90, "B": 80, "C": 70, "D": 60 }[g] || 0);
        const getGradeLetter = (n) => {
          if (n >= 98) return "A+";
          if (n >= 90) return "A";
          if (n >= 80) return "B";
          if (n >= 70) return "C";
          return "D";
        };

        const handleImageUpdate = async (base64) => {
           try {
              const newUrl = await server.updateUserImage(user.id, base64);
              onUpdateUser({ image: newUrl }); // Update local user state
              addToast(t('updatePhotoSuccess'), 'success');
              setImageModalOpen(false);
           } catch(e) {
              addToast("Error: " + e.message, 'error');
           }
        };

        const handleViewReport = async (id) => {
          if (viewingId) return; // Prevent double click
          setViewingId(id);
          try {
             const result = await server.getReport(id);
             if (result && result.base64) {
                 const byteCharacters = atob(result.base64);
                 const byteNumbers = new Array(byteCharacters.length);
                 for (let i = 0; i < byteCharacters.length; i++) {
                     byteNumbers[i] = byteCharacters.charCodeAt(i);
                 }
                 const byteArray = new Uint8Array(byteNumbers);
                 const file = new Blob([byteArray], { type: 'application/pdf' });
                 const fileURL = URL.createObjectURL(file);
                 window.open(fileURL, '_blank');
             } else {
                 addToast("Could not generate preview.", 'error');
             }
          } catch(e) {
             addToast("Error loading report: " + e.message, 'error');
          } finally {
             setViewingId(null);
          }
        };

        const handleViewCombined = async (id1, id2) => {
          if (!id1 && !id2) return;
          const key = `combined-${id1 || ''}-${id2 || ''}`;
          if (viewingId === key) return;
          setViewingId(key);
          
          try {
             const result = await server.getCombinedReport(id1, id2);
             if (result && result.base64) {
                 const byteCharacters = atob(result.base64);
                 const byteNumbers = new Array(byteCharacters.length);
                 for (let i = 0; i < byteCharacters.length; i++) {
                     byteNumbers[i] = byteCharacters.charCodeAt(i);
                 }
                 const byteArray = new Uint8Array(byteNumbers);
                 const file = new Blob([byteArray], { type: 'application/pdf' });
                 const fileURL = URL.createObjectURL(file);
                 window.open(fileURL, '_blank');
             } else {
                 addToast("Could not generate combined report.", 'error');
             }
          } catch(e) {
             addToast("Error loading report: " + e.message, 'error');
          } finally {
             setViewingId(null);
          }
        };

        const openRequestModal = (responseId, evalType) => {
           setEditTarget({ responseId, evalType });
           setEditReason("");
           setEditModalOpen(true);
        };

        const submitRequest = async () => {
           if (!editReason.trim()) { addToast("Please provide a reason.", 'warning'); return; }
           setSubmittingRequest(true);
           try {
              await server.requestEdit(editTarget.responseId, user.name, editReason);
              addToast("Request Submitted. Waiting for Admin Approval.", 'success');
              setEditModalOpen(false);
              loadData(); 
           } catch(e) {
              addToast(e.message, 'error');
           } finally {
              setSubmittingRequest(false);
           }
        };
        
        const processRequest = async (reqId, action) => {
           confirm({
             title: `${action} Request?`,
             message: "This action cannot be undone.",
             onConfirm: async () => {
                try {
                  await server.processRequest(reqId, action);
                  addToast(`Request ${action}`, 'success');
                  loadData();
                } catch(e) { addToast(e.message, 'error'); }
             }
           });
        };

        const processRegistration = async (reqId, action) => {
           confirm({
             title: `${action} Registration?`,
             message: "This action cannot be undone.",
             onConfirm: async () => {
                try {
                  await server.processRegistration(reqId, action);
                  addToast(`Registration ${action}`, 'success');
                  loadData();
                } catch(e) { addToast(e.message, 'error'); }
             }
           });
        };
        
        const handleMonthChange = (e) => {
           const val = e.target.value; // YYYY-MM
           if (val) {
               const [y, m] = val.split('-');
               const start = `${val}-01`;
               const lastDay = new Date(parseInt(y), parseInt(m), 0).getDate();
               const end = `${val}-${String(lastDay).padStart(2, '0')}`;
               
               setDateFrom(start);
               setDateTo(end);
           }
        };

        const handleYearChange = (e) => {
           const val = e.target.value;
           if (val) {
               setDateFrom(`${val}-01-01`);
               setDateTo(`${val}-12-31`);
           }
        };

        const filteredFlatList = useMemo(() => {
           if (!stats || !stats.list) return [];
           return stats.list.filter(item => {
             if (portal === 'DASHBOARD') {
                 if (String(item.trainerName).trim() !== String(user.name).trim()) return false;
             }
             if (portal === 'ADMIN' && selectedTrainers.length > 0) {
                 if (!selectedTrainers.includes(item.trainerName)) return false;
             }

             let itemDate = '';
             if(item.date) itemDate = new Date(item.date).toISOString().split('T')[0];

             if (dateFrom && itemDate < dateFrom) return false;
             if (dateTo && itemDate > dateTo) return false;

             if (filterPosition !== 'All' && item.position !== filterPosition) return false;

             if (selectedNames.length > 0) {
                const combinedName = `${item.traineeName} (${item.traineeId || 'No ID'})`;
                if (!selectedNames.includes(combinedName)) return false;
             }
             
             if (selectedBranches.length > 0 && !selectedBranches.includes(item.branch)) return false;
             if (selectedGrades.length > 0 && !selectedGrades.includes(item.overallGrade)) return false;

             return true;
          });
        }, [stats, dateFrom, dateTo, filterPosition, selectedNames, selectedBranches, selectedGrades, selectedTrainers, portal, user]);

        const derivedStats = useMemo(() => {
           if (!stats) return { total: 0, average: 0, distribution: [], categoryPerformance: [], firstHalf: 0, secondHalf: 0, totalEmployees: 0, totalRequests: 0, memberCount: 0, leaderCount: 0 };
           const count = filteredFlatList.length;
           const gradeCounts = { "A+": 0, "A": 0, "B": 0, "C": 0, "D": 0 };
           const gradeScores = { "A+": 100, "A": 90, "B": 80, "C": 70, "D": 60 };
           
           let totalScore = 0;
           let catSums = {};
           let catCounts = {};

           filteredFlatList.forEach(item => {
              const g = item.overallGrade;
              if(gradeCounts.hasOwnProperty(g)) gradeCounts[g]++;
              else gradeCounts["D"]++;
              
              totalScore += (gradeScores[g] || 0);

              if (item.categoryScores) {
                  Object.keys(item.categoryScores).forEach(cat => {
                      if (!catSums[cat]) { catSums[cat] = 0; catCounts[cat] = 0; }
                      catSums[cat] += item.categoryScores[cat];
                      catCounts[cat]++;
                  });
              }
           });

           const avg = count ? Math.round(totalScore / count) : 0;
           const distribution = Object.keys(gradeCounts).map(k => ({ name: k, value: gradeCounts[k] }));
           
           const categoryPerformance = Object.keys(catSums).map(k => ({
              category: k,
              score: Math.round(catSums[k] / catCounts[k]) || 0
           }));
           if (categoryPerformance.length === 0) categoryPerformance.push({ category: "No Data", score: 0 });
           
           const uniqueMap = {}; 
           filteredFlatList.forEach(i => {
              if (i.traineeId) uniqueMap[i.traineeId] = i.position;
           });
           
           const positions = Object.values(uniqueMap);
           const memberCount = positions.filter(p => p === 'Team Member' || p === 'Team Member').length;
           const leaderCount = positions.filter(p => p === 'Team Leader' || p === 'TL').length;
           const totalEmployees = positions.length;
           
           const responseIdsInView = new Set(filteredFlatList.map(r => r.id));
           const relevantRequests = requests.filter(req => responseIdsInView.has(req.responseId) && req.status === 'Pending').length;

           return {
              total: count,
              average: avg,
              distribution,
              categoryPerformance,
              firstHalf: filteredFlatList.filter(x => x.evaluationType === '1st Half').length,
              secondHalf: filteredFlatList.filter(x => x.evaluationType === '2nd Half').length,
              totalEmployees,
              totalRequests: relevantRequests,
              memberCount,
              leaderCount
           };
        }, [filteredFlatList, stats, requests]);

        const groupedList = useMemo(() => {
            return Object.values(filteredFlatList.reduce((acc, item) => {
                const key = item.traineeId || item.traineeName;
                if (!acc[key]) {
                    acc[key] = {
                        traineeId: item.traineeId,
                        traineeName: item.traineeName,
                        branch: item.branch,
                        position: item.position,
                        trainerName: item.trainerName,
                        email: item.email, 
                        first: null,
                        second: null,
                        comments: []
                    };
                }
                if (item.evaluationType === '1st Half') acc[key].first = item;
                if (item.evaluationType === '2nd Half') acc[key].second = item;
                if (item.comments) acc[key].comments.push(item.comments);
                if (item.email && !acc[key].email) acc[key].email = item.email;
                return acc;
            }, {}));
        }, [filteredFlatList]);
        
        const uniqueOptions = useMemo(() => {
            let sourceList = stats ? stats.list : [];
            if (portal === 'DASHBOARD' && user) {
                 sourceList = sourceList.filter(item => String(item.trainerName).trim() === String(user.name).trim());
            }

            return {
                names: Array.from(new Set(sourceList.map(i => `${i.traineeName} (${i.traineeId || 'No ID'})`))).sort(),
                branches: Array.from(new Set(sourceList.map(i => i.branch).filter(Boolean))).sort(),
                grades: Array.from(new Set(sourceList.map(i => i.overallGrade).filter(Boolean))).sort(),
                trainers: Array.from(new Set(sourceList.map(i => i.trainerName).filter(Boolean))).sort()
            };
        }, [stats, portal, user]);


        if(loading) return <Layout title={t('dashboard')} user={user} onLogout={onLogout}><div className="flex flex-col justify-center items-center p-12"><div className="loader loader-primary mb-2"></div><p className="text-gray-400">{t('loadingData')}</p></div></Layout>;
        if(error || !stats) return <Layout title={t('dashboard')} user={user} onLogout={onLogout}><div className="p-10 text-center text-red-500">Failed to load dashboard data. <br/>{error}</div></Layout>;
        
        const COLORS = ['#ea580c', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
        
        const pendingRequests = requests.filter(r => r.status === 'Pending');

        return (
          <Layout title={portal === 'ADMIN' ? t('adminPortal') : t('dashboard')} user={user} onLogout={onLogout}>
            
            <ImageUploadModal 
               isOpen={isImageModalOpen} 
               onClose={() => setImageModalOpen(false)} 
               onSave={handleImageUpdate} 
            />

            {isEditModalOpen && (
               <Modal title={t('reqTitle')} onClose={() => setEditModalOpen(false)}>
                  <p className="text-sm text-gray-500 mb-4">{t('reqDesc')}</p>
                  <label className="block text-sm font-medium text-slate-700 mb-2">{t('reasonDel')}</label>
                  <textarea 
                     className="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none" 
                     rows="3"
                     value={editReason}
                     onChange={e => setEditReason(e.target.value)}
                  ></textarea>
                  <Button onClick={submitRequest} isLoading={isSubmittingRequest} className="mt-4">{t('submitReq')}</Button>
               </Modal>
            )}

            <div className="mb-6 print:hidden">
              <div className={`p-6 rounded-xl shadow-sm border ${portal === 'ADMIN' ? 'bg-zinc-800 text-white border-zinc-700' : 'bg-white text-slate-800 border-zinc-200'} flex flex-col md:flex-row items-center gap-6`}>
                 
                 {/* Profile Image Section */}
                 <div className="relative group">
                    <div className="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-lg bg-zinc-200">
                       <img 
                         src={user.image || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=random`} 
                         alt="Profile" 
                         className="w-full h-full object-cover" 
                         onError={(e) => {
                           e.currentTarget.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=random`;
                         }}
                       />
                    </div>
                    {portal !== 'ADMIN' && (
                        <button type="button" onClick={() => setImageModalOpen(true)} className="absolute bottom-0 right-0 p-2 bg-orange-600 text-white rounded-full shadow hover:bg-orange-700 transition-colors" title={t('changePhoto')}>
                           <Icon name="camera" size={16} />
                        </button>
                    )}
                 </div>

                 <div className="text-center md:text-left flex-1">
                    <h2 className="text-2xl font-bold">{user.name}</h2>
                    <p className={`text-sm font-mono mb-2 ${portal === 'ADMIN' ? 'text-slate-400' : 'text-slate-500'}`}>{user.id}</p>
                    <div className="flex flex-wrap justify-center md:justify-start gap-2">
                       <span className="px-3 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-700 border border-orange-200">{user.position}</span>
                       <span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-700 border border-blue-200">{user.branch || 'HQ'}</span>
                       <span className="px-3 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-700 border border-purple-200">{user.email}</span>
                    </div>
                 </div>

                 <div className={`hidden md:block p-4 rounded-xl ${portal === 'ADMIN' ? 'bg-white/5' : 'bg-zinc-50'}`}>
                    <div className="flex items-center gap-3 opacity-80">
                        <Icon name={portal === 'ADMIN' ? 'shield-check' : 'bar-chart-2'} size={20} />
                        <span className="font-semibold">{portal === 'ADMIN' ? t('adminOverview') : t('myTracker')}</span>
                    </div>
                 </div>
              </div>
            </div>

            {portal === 'ADMIN' && (
              <div className="grid md:grid-cols-2 gap-6 mb-6">
                
                <Card title={`${t('pendingReg')} (${regRequests.length})`} className="border-blue-200 print:hidden h-64 overflow-y-auto">
                   {regRequests.length === 0 ? (
                      <div className="text-center text-gray-400 py-10 text-sm">{t('noData')}</div>
                   ) : (
                      <table className="w-full text-sm">
                        <thead className="bg-blue-50 text-blue-800 sticky top-0">
                           <tr>
                              <th className="p-2 text-left">{t('fullName')} / ID</th>
                              <th className="p-2 text-left">{t('position')}</th>
                              <th className="p-2 text-right"></th>
                           </tr>
                        </thead>
                        <tbody>
                           {regRequests.map(req => (
                              <tr key={req.reqId} className="border-b last:border-0 hover:bg-zinc-50">
                                 <td className="p-2">
                                    <div className="font-medium">{req.name}</div>
                                    <div className="text-xs text-slate-500">ID: {req.idNumber}</div>
                                    <div className="text-[10px] text-gray-400">{req.email}</div>
                                 </td>
                                 <td className="p-2 text-xs">{req.position} <br/> <span className="text-gray-400">{req.branch}</span></td>
                                 <td className="p-2 text-right flex justify-end gap-1">
                                    <button type="button" onClick={() => processRegistration(req.reqId, 'Approved')} className="p-1 px-2 bg-green-600 text-white rounded text-xs hover:bg-green-700">{t('allow')}</button>
                                    <button type="button" onClick={() => processRegistration(req.reqId, 'Rejected')} className="p-1 px-2 bg-red-600 text-white rounded text-xs hover:bg-red-700">{t('deny')}</button>
                                 </td>
                              </tr>
                           ))}
                        </tbody>
                      </table>
                   )}
                </Card>

                <Card title={`${t('pendingEdit')} (${pendingRequests.length})`} className="border-orange-200 print:hidden h-64 overflow-y-auto">
                   {pendingRequests.length === 0 ? (
                      <div className="text-center text-gray-400 py-10 text-sm">{t('noData')}</div>
                   ) : (
                      <table className="w-full text-sm">
                        <thead className="bg-orange-50 text-orange-800 sticky top-0">
                           <tr>
                              <th className="p-2 text-left">{t('trainerName')}</th>
                              <th className="p-2 text-left">{t('traineeName')}</th>
                              <th className="p-2 text-right"></th>
                           </tr>
                        </thead>
                        <tbody>
                           {pendingRequests.map(req => (
                              <tr key={req.requestId} className="border-b last:border-0 hover:bg-zinc-50">
                                 <td className="p-2 font-medium">{req.trainerName}</td>
                                 <td className="p-2">
                                    <div className="font-medium">{req.traineeName}</div>
                                    <div className="text-xs text-slate-500">{req.evalType}</div>
                                    <div className="text-[10px] text-slate-400 italic">"{req.reason}"</div>
                                 </td>
                                 <td className="p-2 text-right flex justify-end gap-1">
                                    <button type="button" onClick={() => processRequest(req.requestId, 'Approved')} className="p-1 px-2 bg-green-600 text-white rounded text-xs hover:bg-green-700">{t('approved')}</button>
                                    <button type="button" onClick={() => processRequest(req.requestId, 'Rejected')} className="p-1 px-2 bg-red-600 text-white rounded text-xs hover:bg-red-700">{t('rejected')}</button>
                                 </td>
                              </tr>
                           ))}
                        </tbody>
                      </table>
                   )}
                </Card>
              </div>
            )}

            {portal === 'ADMIN' && (
              <div className="mb-6">
                <Card title={t('trainerOverview')} className="overflow-x-auto">
                   <table className="w-full text-sm text-left">
                      <thead className="bg-zinc-50 text-slate-600 sticky top-0 font-bold text-xs uppercase">
                         <tr>
                            <th className="p-3 w-14"></th>
                            <th className="p-3 text-left">{t('trainerName')}</th>
                            <th className="p-3 text-center">{t('colRanking')}</th>
                            <th className="p-3 text-center">{t('colTotalTL')}</th>
                            <th className="p-3 text-center">{t('colTotalEmp')}</th>
                            <th className="p-3 text-center">{t('colTotalTM')}</th>
                            <th className="p-3 text-center">{t('colTotalEval')}</th>
                            <th className="p-3 text-center">{t('colBranches')}</th>
                            <th className="p-3 text-center">{t('colMonthlyComp')}</th>
                            <th className="p-3 text-center">{t('col1stHalf')}</th>
                            <th className="p-3 text-center">{t('colDays')}</th>
                         </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                         {stats.trainerOverview && stats.trainerOverview.map((row, i) => (
                           <tr key={i} className="hover:bg-zinc-50 transition-colors">
                              <td className="p-3">
                                 <div className="w-8 h-8 rounded-full overflow-hidden bg-zinc-200 border border-zinc-300">
                                    <img 
                                      src={row.image || `https://ui-avatars.com/api/?name=${encodeURIComponent(row.name)}&background=random`} 
                                      alt={row.name} 
                                      className="w-full h-full object-cover" 
                                      onError={(e) => {
                                        e.currentTarget.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(row.name)}&background=random`;
                                      }}
                                    />
                                 </div>
                              </td>
                              <td className="p-3 font-medium text-slate-800">{row.name}</td>
                              <td className="p-3 text-center font-bold">
                                 <span className={`px-2 py-1 rounded ${row.performance >= 90 ? 'bg-green-100 text-green-700' : row.performance >= 70 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>
                                    {row.performance}%
                                 </span>
                              </td>
                              <td className="p-3 text-center font-mono text-slate-600">{row.totalTL}</td>
                              <td className="p-3 text-center font-mono text-slate-600">{row.totalEmployees}</td>
                              <td className="p-3 text-center font-mono text-slate-500" title={`Assigned: ${row.assigned}`}>{row.totalTM}</td>
                              <td className="p-3 text-center font-bold text-orange-600">{row.totalEvaluations}</td>
                              <td className="p-3 text-center text-slate-600">{row.totalBranches}</td>
                              <td className="p-3 text-center font-medium text-green-600">{row.completedMonthly}</td>
                              <td className="p-3 text-center text-slate-600">{row.totalFirstHalf}</td>
                              <td className="p-3 text-center text-slate-600">{row.totalDays}</td>
                           </tr>
                         ))}
                         {(!stats.trainerOverview || stats.trainerOverview.length === 0) && (
                            <tr><td colSpan="11" className="p-4 text-center text-gray-400">{t('noTrainerData')}</td></tr>
                         )}
                      </tbody>
                   </table>
                </Card>
              </div>
            )}

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              {[
                { label: t('kpiEmployees'), val: derivedStats.totalEmployees, color: 'border-orange-500', icon: 'users', bg: 'bg-orange-50', text: 'text-orange-600' },
                { label: t('kpiAvg'), val: derivedStats.average + '%', color: 'border-emerald-500', icon: 'star', bg: 'bg-emerald-50', text: 'text-emerald-600' },
                { label: t('kpiPos'), val: `${derivedStats.memberCount} | ${derivedStats.leaderCount}`, color: 'border-blue-500', icon: 'briefcase', bg: 'bg-blue-50', text: 'text-blue-600' },
                { label: t('kpiHalves'), val: `${derivedStats.firstHalf} | ${derivedStats.secondHalf}`, color: 'border-purple-500', icon: 'trending-up', bg: 'bg-purple-50', text: 'text-purple-600' },
              ].map((k, i) => (
                <div key={i} className={`bg-white p-4 rounded-xl shadow-sm border-l-4 ${k.color} flex items-center justify-between`}>
                  <div>
                    <p className="text-slate-500 text-xs font-bold uppercase mb-1">{k.label}</p>
                    <p className="text-2xl font-bold text-slate-800">{k.val}</p>
                  </div>
                  <div className={`p-3 rounded-full ${k.bg} ${k.text}`}><Icon name={k.icon} /></div>
                </div>
              ))}
            </div>

            <div className="grid lg:grid-cols-3 gap-6 mb-6">
              <Card title={t('gradeDist')} className="lg:col-span-1 min-h-[400px]">
                {canRenderCharts ? (
                  <div className="h-48 w-full mb-4">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={derivedStats.distribution}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                        <XAxis dataKey="name" tickLine={false} axisLine={false} />
                        <YAxis tickLine={false} axisLine={false} />
                        <Tooltip cursor={{fill: 'transparent'}} contentStyle={{borderRadius: '8px'}} />
                        <Bar dataKey="value" radius={[4, 4, 0, 0]}>
                          {derivedStats.distribution.map((e, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                ) : <div className="h-48 flex items-center justify-center text-gray-400">{t('chartsLoading')}</div>}
                <div className="border-t pt-4">
                  <h4 className="text-xs font-bold text-gray-500 uppercase mb-3">{t('countBreakdown')}</h4>
                  <div className="grid grid-cols-2 gap-2 text-sm">
                    {derivedStats.distribution.map(d => (
                       <div key={d.name} className="flex justify-between p-2 bg-zinc-50 rounded">
                         <span className="font-semibold">{d.name}</span>
                         <span className="text-orange-600 font-bold">{d.value}</span>
                       </div>
                    ))}
                  </div>
                </div>
              </Card>

              <Card title={t('catPerf')} className="lg:col-span-2 min-h-[400px]">
                <div className="flex flex-col md:flex-row h-full gap-4">
                   <div className="flex-1 h-64 md:h-auto">
                      {canRenderCharts ? (
                        <ResponsiveContainer width="100%" height="100%">
                          <RadarChart cx="50%" cy="50%" outerRadius="80%" data={derivedStats.categoryPerformance}>
                            <PolarGrid />
                            <PolarAngleAxis dataKey="category" />
                            <PolarRadiusAxis angle={30} domain={[0, 100]} />
                            <Radar name="Score" dataKey="score" stroke="#ea580c" fill="#ea580c" fillOpacity={0.6} />
                            <Tooltip />
                          </RadarChart>
                        </ResponsiveContainer>
                      ) : <div className="h-full flex items-center justify-center text-gray-400">{t('chartsLoading')}</div>}
                   </div>
                   <div className="w-full md:w-1/3">
                      <table className="w-full text-sm">
                        <thead className="bg-zinc-50 text-left text-gray-500">
                          <tr><th className="p-2">Category</th><th className="p-2">Avg</th></tr>
                        </thead>
                        <tbody>
                           {derivedStats.categoryPerformance.map((c, i) => (
                             <tr key={i} className="border-b last:border-0">
                               <td className="p-2">{c.category}</td>
                               <td className="p-2 font-bold text-orange-700">{c.score}%</td>
                             </tr>
                           ))}
                        </tbody>
                      </table>
                   </div>
                </div>
              </Card>
            </div>

            <Card className="mb-6 bg-zinc-50 border-zinc-200 print:hidden overflow-visible">
               <div className="flex flex-col gap-4">
                 <div className="flex gap-2 p-1 bg-zinc-100 rounded-lg self-start">
                    {['All', 'Team Member', 'Team Leader'].map(pos => (
                      <button 
                        key={pos} 
                        type="button"
                        onClick={() => setFilterPosition(pos)} 
                        className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${filterPosition === pos ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                      >
                        {pos === 'All' ? t('all') : (pos === 'Team Member' ? t('teamMember') : t('teamLeader'))}
                      </button>
                    ))}
                 </div>
                 
                 <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">{t('quickSelect')}</label>
                      <div className="flex gap-2">
                        <input type="month" onChange={handleMonthChange} className="w-2/3 text-sm p-2 border rounded focus:ring-2 focus:ring-orange-500 outline-none" title="Select Month" />
                        <select onChange={handleYearChange} className="w-1/3 text-sm p-2 border rounded focus:ring-2 focus:ring-orange-500 outline-none bg-white" title="Select Full Year">
                            <option value="">{t('year')}</option>
                            {[2024, 2025, 2026, 2027, 2028, 2029, 2030].map(y => (
                                <option key={y} value={y}>{y}</option>
                            ))}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">{t('dateRange')}</label>
                      <div className="flex gap-2">
                        <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-orange-500 outline-none" />
                        <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="w-full text-sm p-2 border rounded focus:ring-2 focus:ring-orange-500 outline-none" />
                      </div>
                    </div>
                    {portal === 'ADMIN' && (
                       <div><MultiSelect label={t('trainerName')} options={uniqueOptions.trainers} selected={selectedTrainers} onChange={setSelectedTrainers} /></div>
                    )}
                    <div><MultiSelect label={t('traineeName')} options={uniqueOptions.names} selected={selectedNames} onChange={setSelectedNames} /></div>
                    <div><MultiSelect label={t('branch')} options={uniqueOptions.branches} selected={selectedBranches} onChange={setSelectedBranches} /></div>
                    <div><MultiSelect label={t('grade')} options={uniqueOptions.grades} selected={selectedGrades} onChange={setSelectedGrades} /></div>
                 </div>
               </div>
            </Card>

            <Card title="Evaluations List" className="overflow-hidden flex flex-col print:hidden">
              <div className="mb-4 flex justify-between items-center print:hidden">
                <div className="text-sm text-slate-500">{t('showing')} {groupedList.length} {t('records')}</div>
                <div className="flex gap-2">
                    <button type="button" onClick={() => window.print()} className="flex items-center gap-2 px-4 py-2 bg-orange-600 text-white rounded-lg text-sm font-medium hover:bg-orange-700">
                       <Icon name="printer" size={16} /> Print
                    </button>
                </div>
              </div>
              
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead className="bg-zinc-50 text-slate-500 font-medium">
                    <tr>
                      <th className="px-4 py-3 w-10">{t('sn')}</th>
                      <th className="px-4 py-3 w-1/6">{t('trainerName')}</th>
                      <th className="px-4 py-3 w-20">ID</th>
                      <th className="px-4 py-3 w-1/5">{t('traineeName')}</th>
